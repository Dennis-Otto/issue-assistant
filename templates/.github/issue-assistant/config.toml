# Settings of the issue assistant: https://github.com/Dennis-Otto/issue-assistant

[engine]
# The AI engine that writes the analysis; its secret belongs to the environment
# issue-assistant. Leave out model for the engine's default. light_model runs the
# replies to one comment, which only judge it, yes or no; without it, model does.
# effort sets how much the model thinks, for the models that take it: low, medium,
# high, xhigh or max; without it, the model's default.
name = "claude"
# model = "claude-opus-5-5"
# light_model = "claude-sonnet-5-5"
# effort = "medium"
# What one run may use: the turns of an analysis and of a maintainer's question, of
# which a follow-up takes half and a reply to one comment a tenth, and the dollars
# at which the engine stops, as it counts them at the prices of its API.
max_turns = 40
max_budget_usd = 1.00
# The most AI runs that people who don't maintain the repository start: analyses
# of new issues, first answers to discussions, follow-ups and replies after a
# release in 24 hours, analyses and first answers of one person's new issues and
# discussions in 24 hours, and comments of a reporter after a release closed their
# issue that the AI reads. Over a limit, the issue gets its labels and waits for the
# maintainer; 0 lets only maintainers start the AI, by hand.
max_per_day = 20
max_per_author_per_day = 3
release_replies = 2

[context]
# What the AI reads besides the issue, for an analysis and a follow-up: every open
# issue, the max_issues closed issues that changed last, and the max_discussions
# discussions that changed last. An analysis also reads the older issues that a
# search for the words of the new issue finds, and what the maintainers corrected
# of the analyses of the max_analyzed issues analyzed last. A reply to a comment
# reads only the issue and that comment.
max_issues = 1000
max_discussions = 1000
max_analyzed = 30

[related]
# Public repositories that share users and topics with this one, as "owner/name", up
# to 5. A first analysis also searches their issues, links those that help, and says
# when an issue may belong in one of them; a maintainer transfers it by hand.
repositories = []

[discussions]
# The categories of GitHub Discussions whose new discussions get a first answer from
# the AI, checked as every analysis, which install sets up with the workflow
# discussion-assistant.yml; [] answers none. The answers count toward the limits of
# [engine], as new issues do.
answer_categories = ["Q&A"]

[links]
# Hosts that links in the assistant's comments may lead to, besides this repository.
hosts = []

[forms]
# The dropdown of the issue forms whose answer chooses an area label, and the
# answers that choose none.
area_field = "Area"
unmapped_options = ["Other"]

[transparency]
# Files that tell reporters which AI reads their issue; the check command makes sure
# they name the engine.
files = ["SUPPORT.md"]

[releases]
# A merged pull request that fixes an issue labels it fixed-in-next-release; the
# issue closes with a link to the first release that ships the fix. Set to false
# for a repository without releases.
close_with_release = true

[lifecycle]
# The days of the lifecycle: a reminder after the last question without an answer,
# the closing on the day that the reminder names, the closing of a sure duplicate
# after its notice, and the window after a release in which the reporter's comment
# reopens the issue. The descriptions of needs-info, stale and possible-duplicate in
# labels.toml name the same days, which the check command makes sure of.
remind_after_days = 15
close_after_days = 30
duplicate_grace_days = 3
reopen_after_release_days = 30
# How often the AI follows up on the reporter's answers to its questions.
max_follow_ups = 2
# Issues that the sweep never reminds, closes or locks: with one of these labels,
# assigned to someone when exempt_assignees is true, or with at least exempt_upvotes
# thumbs up; 0 exempts none for their thumbs up.
exempt_labels = ["pinned", "security"]
exempt_assignees = false
exempt_upvotes = 0
# Lock issues closed for more than this many days, at least the window after a
# release, with one line that points to a new issue; 0 locks none.
lock_closed_after_days = 0
