# Settings of the issue assistant: https://github.com/Dennis-Otto/issue-assistant

[engine]
# The AI engine that writes the analysis; its secret belongs to the environment
# issue-assistant. Leave out model for the engine's default.
name = "claude"
# model = "claude-opus-5-5"
# The most AI runs that people who don't maintain the repository start: analyses
# of new issues, follow-ups and replies after a release in 24 hours, analyses of
# one reporter's new issues in 24 hours, and comments of a reporter after a release
# closed their issue that the AI reads. Over
# a limit, the issue gets its labels and waits for the maintainer; 0 lets only
# maintainers start the AI, by hand.
max_per_day = 20
max_per_author_per_day = 3
release_replies = 2

[links]
# Hosts that links in the assistant's comments may lead to, besides this repository.
hosts = []

[forms]
# The dropdown of the issue forms whose answer chooses an area label, and the
# answers that choose none.
area_field = "Area"
unmapped_options = ["Other"]

[transparency]
# Files that tell reporters which AI reads their issue; the check command makes sure
# they name the engine.
files = ["SUPPORT.md"]

[releases]
# A merged pull request that fixes an issue labels it fixed-in-next-release; the
# issue closes with a link to the first release that ships the fix. Set to false
# for a repository without releases.
close_with_release = true

[lifecycle]
# The days of the lifecycle: a reminder after the last question without an answer,
# the closing on the day that the reminder names, the closing of a sure duplicate
# after its notice, and the window after a release in which the reporter's comment
# reopens the issue. The descriptions of needs-info, stale and possible-duplicate in
# labels.toml name the same days, which the check command makes sure of.
remind_after_days = 15
close_after_days = 30
duplicate_grace_days = 3
reopen_after_release_days = 30
# How often the AI follows up on the reporter's answers to its questions.
max_follow_ups = 2
# Issues that the sweep never reminds, closes or locks: with one of these labels,
# assigned to someone when exempt_assignees is true, or with at least exempt_upvotes
# thumbs up; 0 exempts none for their thumbs up.
exempt_labels = ["pinned", "security"]
exempt_assignees = false
exempt_upvotes = 0
# Lock issues closed for more than this many days, at least the window after a
# release, with one line that points to a new issue; 0 locks none.
lock_closed_after_days = 0
