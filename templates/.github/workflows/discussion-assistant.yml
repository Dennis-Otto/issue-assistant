name: Discussion assistant

# A first answer to new discussions in the categories that [discussions]
# answer_categories of .github/issue-assistant/config.toml names, such as Q&A:
# https://github.com/Dennis-Otto/issue-assistant
#
# The jobs are the issue assistant's reusable workflow at the commit of a release, as
# in issue-assistant.yml: event and apply run no AI; analyze runs the engine of
# config.toml with a read-only token and read-only tools on the egress-firewall
# runner (.github/egress-firewall.yaml), and apply checks its answer before it posts
# one comment, which it never marks as the answer. Only apply may write to
# discussions. The permissions below are the most that any of its jobs gets.
#
# Without the engine's secret in the environment issue-assistant, or with the
# repository variable ISSUE_ASSISTANT_AI set to "off", no discussion gets an answer.
# The issue assistant's check command keeps this file equal to its template.

on:
  discussion:
    types: [created]
  workflow_dispatch:
    inputs:
      discussion:
        description: Number of the discussion
        required: true
        type: number
      dry_run:
        description: Only show what the assistant would do
        type: boolean
        default: true

permissions: {}

# The runs of one discussion run one after the other, so that a run by hand sees
# the answer of the run of its event.
concurrency:
  group: discussion-assistant-${{ github.event.discussion.number || inputs.discussion }}
  cancel-in-progress: false

jobs:
  assistant:
    name: Discussion assistant
    permissions:
      contents: read
      issues: read
      discussions: write
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-discussion-assistant.yml@a12fb7227ff7d966809cad4e043e159977fccfcd # v1.2.2
    with:
      dry_run: ${{ inputs.dry_run || false }}
    # Passed by name: only the job analyze sees their values, those of the
    # environment issue-assistant, which only the default branch may use.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
