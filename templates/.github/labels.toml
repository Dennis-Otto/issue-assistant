# Every label of the repository. The Labels workflow creates missing labels and
# updates color and description from this file when it changes on main; it never
# deletes a label. Rename a label on GitHub first, then here.
#
# group decides who sets a label:
#   type       the kind of an issue; the issue forms set one, the assistant may correct it
#   area       the part of the project; set from the Area field of a form and by the assistant
#   topic      cross-cutting topics the assistant may add
#   priority   optional: how urgent an issue is; the assistant gives one to an issue
#              that has none, and never changes one
#   lifecycle  set and removed by the assistant's rules; all seven are required
#   decision   set by the maintainer only
#   release    set on pull requests, for the release notes
#   dependabot set by Dependabot on its pull requests
#
# form_options lists the answers of the Area field that choose a label.
# ask = false keeps the assistant from asking reporters of that kind for information.
# owners, of an area, lists the GitHub logins that a new issue of the area is
# assigned to, when nobody is; GitHub notifies them, the assistant mentions nobody.
# issue_type, of a kind, names the issue type that its issues get, in a repository
# of an organization; the Labels workflow warns of a type that GitHub doesn't know.

[[label]]
name = "bug"
color = "d73a4a"
description = "Something isn't working"
group = "type"
# issue_type = "Bug"

[[label]]
name = "enhancement"
color = "a2eeef"
description = "New feature or improvement"
group = "type"
ask = false
# issue_type = "Feature"

[[label]]
name = "question"
color = "d876e3"
description = "A question about setup or use"
group = "type"

[[label]]
name = "documentation"
color = "0075ca"
description = "Improvements or additions to documentation"
group = "type"

# The parts of the project, one label each, with the answers of the field Area of
# the issue forms that choose it; add your own and their answers to the forms.
[[label]]
name = "area: setup"
color = "c5def5"
description = "Installing, configuring or updating"
group = "area"
form_options = ["Installation, configuration or update"]
# owners = ["your-login"]

[[label]]
name = "area: docs"
color = "c5def5"
description = "The documentation"
group = "area"
form_options = ["Documentation"]

# Priorities are optional; the assistant chooses one by their descriptions, judged
# by what an issue shows. Take these in, or write your own.
# [[label]]
# name = "priority: high"
# color = "b60205"
# description = "Breaks the project for many users or loses data, without a workaround"
# group = "priority"
#
# [[label]]
# name = "priority: medium"
# color = "fbca04"
# description = "Hinders some users, or has a workaround"
# group = "priority"
#
# [[label]]
# name = "priority: low"
# color = "c2e0c6"
# description = "A detail, or affects few users"
# group = "priority"

# The lifecycle. The descriptions of needs-info, stale and possible-duplicate name
# the days of [lifecycle] in config.toml, or no days; stale names the days from the
# reminder to the closing. The check command fails on a description with other days.

[[label]]
name = "needs-triage"
color = "fbca04"
description = "Not yet reviewed by a maintainer"
group = "lifecycle"

[[label]]
name = "needs-info"
color = "fef2c0"
description = "Waiting for the reporter: reminder after 15 days, closed after 30 days"
group = "lifecycle"

[[label]]
name = "stale"
color = "f9d0c4"
description = "Reminder sent; closes 15 days later without an answer"
group = "lifecycle"

[[label]]
name = "possible-duplicate"
color = "e4e4e4"
description = "Closes as a duplicate 3 days after the notice unless someone objects"
group = "lifecycle"

[[label]]
name = "duplicate"
color = "cfd3d7"
description = "This issue or pull request already exists"
group = "lifecycle"

[[label]]
name = "invalid"
color = "e4e669"
description = "Spam, or not about this project"
group = "lifecycle"

[[label]]
name = "fixed-in-next-release"
color = "c2e0c6"
description = "Fixed on the default branch; closes with a link when a release ships the fix"
group = "lifecycle"

[[label]]
name = "wontfix"
color = "ffffff"
description = "This will not be worked on"
group = "decision"

[[label]]
name = "assistant-muted"
color = "ededed"
description = "The assistant starts no AI run on this issue; /assistant unmute ends it"
group = "decision"
