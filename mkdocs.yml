# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current; a setting here
# wins over the same one there. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Issue assistant"
site_description: "Safe AI issue triage for GitHub: a read-only AI writes a first analysis of every new issue (likely cause, missing info, duplicates, labels), and a job without AI validates it before posting."
site_url: https://dennis-otto.github.io/issue-assistant/
repo_url: https://github.com/Dennis-Otto/issue-assistant
repo_name: Dennis-Otto/issue-assistant
copyright: "© 2026 Dennis Otto"

# The brand: the speech bubble of the social preview as the logo and the icon of the
# tab, and the violet of the badge of the action for the header, the links and the
# preview cards; docs/stylesheets/brand.css has the colours. The palette replaces
# that of the blueprint, so it repeats its switch between the scheme of the system,
# light and dark, with the colours of the brand.
theme:
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the scheme of the system
plugins:
  social:
    cards_layout_options:
      background_color: "#5a32a3"
      color: "#ffffff"

# What the Markdown of the pages can't say itself: scripts/mkdocs_hooks.py. The
# pictures of the pages come from the commit that the website is built from, the
# switch between light and dark chooses them, and only the shown ones load; the
# comments of What reporters see and the tables of the inputs and outputs of the
# action come from issue_assistant.py and action.yml; and every page gets a
# description of its own. Links from before lead to the page that has their anchor
# now. This list replaces that of the blueprint, so it names the hooks of the
# blueprint too, which try a failed download again.
hooks:
  - .github/mkdocs_blueprint.py
  - scripts/mkdocs_hooks.py
extra_css:
  - stylesheets/brand.css
  # Diagrams that scroll sideways on phones instead of shrinking.
  - stylesheets/diagrams.css
  # A picture in each theme, with no link to the hidden copy.
  - stylesheets/pictures.css
  # The comments of What reporters see, as GitHub shows them.
  - stylesheets/comments.css
  # The keys and names in the first column of a table on one line.
  - stylesheets/tables.css

# The menu: a tab in the header for each section, and beside a page the other pages
# of its section. Get started comes first, since a visitor comes to set it up, and
# each feature has a page, so that a search lands on what it looks for.
nav:
  - Home: index.md
  - Get started: getting-started.md
  - Features:
      - All features: features/README.md
      - The first analysis: features/first-analysis.md
      - The life of an issue: features/life-of-an-issue.md
      - Priorities, owners and issue types: features/priorities.md
      - Waiting periods and old threads: features/waiting-periods.md
      - Duplicates: features/duplicates.md
      - Related repositories: features/related-repositories.md
      - Questions in Discussions: features/discussions.md
      - Slash commands: features/slash-commands.md
      - From the fix to the release: features/fix-to-release.md
      - What the AI reads: features/what-the-ai-reads.md
      - Saying no to the AI: features/opt-out.md
      - Languages: features/languages.md
      - Limits of the AI runs: features/limits.md
      - What one run may cost: features/cost.md
      - What the sweep tells the maintainers: features/digest.md
      - Good first issue candidates: features/good-first-issues.md
      - When GitHub fails: features/github-failures.md
  - Guide:
      - Overview: guide.md
      - How it works: how-it-works.md
      - Configuration: configuration.md
      - Every key: every-key.md
      - Reference: reference.md
      - Engines: engines.md
      - What reporters see: comments.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
  - Compare: comparison.md
  - Accuracy: accuracy.md
  - Security:
      - Security design: security.md
      - PromptPwnd and Comment and Control: security/prompt-attacks.md
      - The engines and their packages: security/engines.md
      - How an issue reaches the AI: security/issue-text.md
      - What becomes of the answer: security/answers.md
      - Threats and countermeasures: security/threats.md
      - Threats to the runs and the workflows: security/threats-to-the-runs.md
  - Project:
      - Architecture: architecture.md
      - How a template travels: architecture/templates.md
      - How the assistant is tested: architecture/testing.md
      - The canary and the Workflow test: architecture/dry-runs.md
      - Failures and hard texts: architecture/failures.md
      - Roadmap: roadmap.md
      - Decisions: decisions/README.md
      - Changelog: changelog.md
