# The settings of the tools that scripts/check.sh runs. The release bot keeps the
# version in version.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["issue_assistant"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
# GitHub's Ubuntu 24.04 runners run the action with their Python 3.12.
target-version = "py312"
# The settings tool of the blueprint, which the blueprint keeps current.
extend-exclude = [".github/blueprint.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["issue_assistant.py"]

[tool.ruff.lint.isort]
known-first-party = ["issue_assistant", "oracle", "support"]
