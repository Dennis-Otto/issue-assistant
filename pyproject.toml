[project]
name = "issue-assistant"
version = "1.2.2"
description = "First analysis, labels, duplicates and reminders for GitHub issues, with an AI that only reads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["issue_assistant"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
# GitHub's Ubuntu 24.04 runners run the action with their Python 3.12.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["issue_assistant.py"]

[tool.ruff.lint.isort]
known-first-party = ["issue_assistant", "oracle", "support"]
