# The settings of the tools that scripts/check.sh runs. The release bot keeps the
# version in version.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers"
markers = [
    # The Mutation workflow runs the tests with -m "not mutation_unsafe" in mutmut's
    # copy, mutants/, which holds every mutant of a function beside it; see
    # tests/test_mutation_safety.py.
    "mutation_unsafe: can't pass in mutmut's copy of the repository, because it reads the package as text, asks Git or starts the tool",
]

[tool.coverage.run]
branch = true
# The action, and the hooks that build the website from it in scripts/.
source = ["issue_assistant", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
# GitHub's Ubuntu 24.04 runners run the action with their Python 3.12.
target-version = "py312"
# The settings tool of the blueprint, which the blueprint keeps current.
extend-exclude = [".github/blueprint.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The package hands on the names of its modules to the tests, the fuzzers and the
# scripts. No code of it runs on those names, so no name can be undefined there, and
# the modules stay in the order of their layers, from the ground up.
"issue_assistant/__init__.py" = ["F403", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
# The action, the script of the Canary that measures the wait for a runner, the check
# of the names that keep each engine to reading, the script that keeps the copies of
# GitHub's schemas, and the script of the Workflow test that checks the jobs of its run.
files = [
  "issue_assistant",
  "scripts/canary_queue.py",
  "scripts/engine_contract.py",
  "scripts/github_schemas.py",
  "scripts/workflow_test.py",
]

[tool.ruff.lint.isort]
known-first-party = ["issue_assistant", "oracle", "seeds", "support"]
