# The name and the description are those of the listing on the GitHub Marketplace,
# where an action named Issue Assistant exists already; the description shows there
# with at most 125 characters, and the color is the violet of the project.
name: Read-only issue assistant
description: "Read-only AI issue triage, checked before posting: cause, missing info, duplicates and labels; reminders; closing on release."
author: Dennis Otto
branding:
  icon: message-circle
  color: purple

inputs:
  command:
    description: event, engine, context, analyze, apply, usage, sweep, sync-labels, findings or check
    required: true
  issue:
    description: Number of the issue, for context, apply and usage
    required: false
    default: ""
  mode:
    description: Task of the engine (triage, follow-up, maintainer-reply, release-reply or maintainer-question), for engine, context, analyze, apply and usage
    required: false
    default: ""
  answer:
    description: The engine's JSON answer, for apply
    required: false
    default: ""
  engine:
    description: The engine that wrote the answer, for apply, or that analyze runs
    required: false
    default: ""
  engine-version:
    description: The version of the engine's command line that analyze installs, such as 1.2.3
    required: false
    default: ""
  ready-engines:
    description: Engines whose secret exists, separated by commas, for engine
    required: false
    default: ""
  execution-file:
    description: The execution file of the engine's action, whose numbers usage reports
    required: false
    default: ""
  dry-run:
    description: Only report what would be written
    required: false
    default: "false"
  github-token:
    description: Token for the GitHub API; the job's permissions limit it
    required: false
    default: ${{ github.token }}

outputs:
  issue:
    description: The issue of the event
    value: ${{ steps.run.outputs.issue }}
  mode:
    description: The engine's next task, or none
    value: ${{ steps.run.outputs.mode }}
  engine:
    description: The engine of the repository's config.toml
    value: ${{ steps.run.outputs.engine }}
  ready:
    description: Whether the engine's secret exists
    value: ${{ steps.run.outputs.ready }}
  model:
    description: The engine's model for the task
    value: ${{ steps.run.outputs.model }}
  turns:
    description: The most turns of the engine for the task
    value: ${{ steps.run.outputs.turns }}
  budget:
    description: The most dollars that the engine's run may cost
    value: ${{ steps.run.outputs.budget }}
  effort:
    description: The engine's effort, or empty for its default
    value: ${{ steps.run.outputs.effort }}
  task:
    description: The task for the engine, which the rules in .issue-assistant/rules.md precede as its system prompt
    value: ${{ steps.run.outputs.task }}
  prompt:
    description: The rules and the task in one prompt, for templates before the rules became a system prompt
    value: ${{ steps.run.outputs.prompt }}
  schema:
    description: The JSON schema of the engine's answer, in its strict form for an engine that wants one
    value: ${{ steps.run.outputs.schema }}
  engine-args:
    description: The arguments that the engine's action adds to its command line, such as the rules, as JSON; empty for an engine without any
    value: ${{ steps.run.outputs.engine-args }}
  answer:
    description: The engine's answer, from analyze
    value: ${{ steps.run.outputs.answer }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        ISSUE: ${{ inputs.issue }}
        MODE: ${{ inputs.mode }}
        RESULT: ${{ inputs.answer }}
        ENGINE: ${{ inputs.engine }}
        ENGINE_VERSION: ${{ inputs.engine-version }}
        READY_ENGINES: ${{ inputs.ready-engines }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        DRY_RUN: ${{ inputs.dry-run }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        # The jobs of the templates block every host but GitHub's, and the GitHub
        # CLI's telemetry would only knock at another one.
        GH_TELEMETRY: "false"
      # Every value reaches the script through the environment, never the script text.
      run: python3 "$GITHUB_ACTION_PATH/issue_assistant.py" "$COMMAND"
