# The explanations of the checks of this project alone, on top of .github/checks.toml,
# which the blueprint keeps current. When one of them fails, the PR coach shows its
# explanation in the summary of the check, as its annotation and in its comment on the
# pull request, also on a pull request from a fork; scripts/check.sh shows those of its
# steps on your machine too. Explain every check that you add to the required checks
# of .github/repository.project.toml, so that the next person sees how to fix it. The
# comment follows a workflow of this project alone, such as one of visual tests, once
# the answer test_workflows of .copier-answers.yml names it.
# https://github.com/Dennis-Otto/repo-blueprint#the-pr-coach

# A check by the name that GitHub shows, where a * stands for any text. Each has a
# title, problem, why and fix, and may have commands, one per line, and docs, a link or
# a file of the repository with its anchor. Each says in autofix how it fixes itself:
# the commands that fix what it finds, or the reason why no command can. The fix bot
# commits only the fixes of the runs of Lint and of the CI, not yet those of a
# workflow of the project's own (Dennis-Otto/repo-blueprint#225), so a person runs
# the commands of such a check.
#
# Each job of the Action test, .github/workflows/action-test.yml, ends with the step
# "Explain the failure": it explains each of its parts that failed, by the keys below,
# and the job itself only when none of them did, as lint explains each linter.
# tests/test_coach.py checks that every job, every part and every command of a part
# fit the workflow, so that an explanation can't drift from what its check runs.

# ---------------------------------------------------------------- the job action

[check.action]
title = "The test of the action"
problem = """A step of the test of the action failed before its parts ran, such as the
checkout of the pull request. When a part fails, the PR coach explains that part
instead: the workflows of the templates, their security, or the set-up of the sample
repository or of this repository through the action."""
why = """The job runs the action as the repositories that use it run it, with the
templates that the next release brings them: what fails here fails for them."""
fix = """Run the check again; if it fails at the same step, the log of the check says
why."""
docs = "docs/architecture/templates.md"
autofix = """A step that fails before the parts needs a look at its log; each part
says in its own explanation how it is fixed."""

[check.template-lint]
title = "The workflows of the templates (actionlint)"
problem = """A workflow in `templates/.github/workflows/`, which `install` writes into
every repository that uses the action, breaks a rule of actionlint, such as an
expression with a mistake, an input or an output that doesn't exist, or a shell script
that ShellCheck flags; the log of the step names the file and the line."""
why = """The Lint workflow lints the workflows of this repository only, whose copies of
the templates are those of the last release. A mistake in a template fails only when
it runs, in every repository that installed it."""
fix = """Fix each line that the log names, in `templates/`, never in the copies in
`.github/`. actionlint runs on your machine with Docker, as the check runs it:"""
commands = [
  "docker run --rm -v \"$PWD:/repo\" -w /repo rhysd/actionlint:1.7.12 -config-file .github/actionlint.yaml -ignore 'unexpected key \"queue\" for \"concurrency\" section' templates/.github/workflows/*.yml",
]
docs = "docs/architecture/templates.md"
autofix = """A mistake of a workflow needs a person, who knows what the template should
do, and no bot writes a template that every repository runs."""

[check.template-security]
title = "The security of the templates (zizmor)"
problem = """zizmor found a security problem in a workflow in
`templates/.github/workflows/`, such as an expression of the event in a script, the
credentials that a checkout keeps or an action that isn't pinned to a commit; the log
of the step names the file, the line and the audit."""
why = """Every repository that uses the action runs these workflows with its own token,
on issues that anyone can write: a weakness in a template gives an issue the power to
change each of them. The Workflow security workflow reports the findings of the
workflows of this repository to code scanning; this step stops a finding in a
template before any repository gets it."""
fix = """Open the documentation of the audit that the log names, which shows the fix,
and fix the template in `templates/`. A finding that the project accepts on purpose
goes into `.github/zizmor.yml` with the reason. zizmor runs on your machine as well:"""
commands = ["pipx run zizmor --config .github/zizmor.yml templates"]
docs = "https://docs.zizmor.sh/audits/"
autofix = """A weakness of a template needs a person, and no bot writes a template that
every repository runs."""

[check.sample-setup]
title = "The set-up of the sample repository"
problem = """`install` of this commit couldn't set up the sample repository in
`tests/sample/`, or `check` of the action found a problem in the set-up that `install`
wrote, with PyYAML or, in the step that hides PyYAML, with the `yq` of the runner; the
annotations of the step name each problem."""
why = """The sample is a repository that uses the action, set up as a new user sets it
up. When `check` rejects what `install` writes, every repository that runs `install`
after the next release gets a set-up that its own check rejects."""
fix = """Fix `install` or `check` in `issue_assistant.py`, with a test in
`tests/test_setup.py`, or the template in `templates/` that the problem names. The
step runs on your machine as it runs in the check, in a copy of the sample:"""
commands = [
  'root="$(mktemp -d)"',
  'cp -r tests/sample/. "$root"',
  'ISSUE_ASSISTANT_ROOT="$root" python3 issue_assistant.py install --ref "$(git rev-parse HEAD)" --version smoke-test',
  'ISSUE_ASSISTANT_ROOT="$root" python3 issue_assistant.py check',
]
docs = "docs/architecture/templates.md"
autofix = """What `install` writes and what `check` accepts are rules of the action,
which a person decides."""

[check.own-setup]
title = "The set-up of this repository with the templates of this commit"
problem = """With the templates of this commit installed into a copy of this
repository, `check` of the action found a problem in its set-up, such as a label of
`.github/labels.toml`, a setting of `.github/issue-assistant/config.toml` or an issue
form that the templates no longer fit; the annotations of the step name each
problem."""
why = """The blueprint brings the templates of the next release into this repository,
as into every repository made from it: a set-up that `check` rejects with them fails
the check issue-assistant of that update, here and in each of them."""
fix = """Fix the file that the problem names, here or in `templates/`, or `check` in
`issue_assistant.py`, with a test in `tests/test_setup.py`. The step runs on your
machine as it runs in the check, in a copy of the repository:"""
commands = [
  'root="$(mktemp -d)"',
  'cp -r . "$root"',
  'rm "$root/.github/egress-firewall.yaml"',
  'ISSUE_ASSISTANT_ROOT="$root" python3 issue_assistant.py install --ref "$(git rev-parse HEAD)" --version smoke-test',
  'ISSUE_ASSISTANT_ROOT="$root" python3 issue_assistant.py check',
]
docs = "docs/architecture/templates.md"
autofix = """Whether the set-up of this repository or a template gives way is the
decision of a maintainer."""

# ---------------------------------------------------------------- the runners

[check.other-runner]
title = "The action on a runner other than that of the templates"
problem = """The job also runs on `ubuntu-26.04`, which `ubuntu-latest` means since
2026-10-19, and on `ubuntu-24.04-arm`; the name of the check ends with the runner of
this leg. The job failed on it. When the check without a runner in its name passes, the
cause is what this image has differently: the version of Python, of `gh` or of `yq`,
PyYAML on the Python of the image, or the architecture."""
why = """Repositories call the action from jobs of their own, such as `check` on
`ubuntu-latest`, and the README names these runners as supported. What fails only here
fails for them, while the workflows of the templates, on `ubuntu-24.04`, keep
working."""
fix = """Compare the log of this leg with the leg on `ubuntu-24.04`. The set-up of each
runner lists what its image brings at the top of the log, and the images are described
in [actions/runner-images](https://github.com/actions/runner-images). Make
`issue_assistant.py` work with both, with a test of the difference. When the image is at
fault, such as a broken release of it, run the check again later."""
docs = "docs/architecture/dry-runs.md#the-runners-that-the-action-is-tested-on"
autofix = """Which difference of a runner matters is for a person to find in the two
logs."""

[check."the action on a Python that is too old"]
title = "The message of the action on a Python that is too old"
problem = """On Python 3.11 the action didn't stop in its first step with the message that
names the version and the fix: it either ran, or the step that checks the version in
`action.yml` let this Python through, wrote no such message or wrote a traceback; the
log says which."""
why = """A repository on an older runner, such as `ubuntu-22.04`, or with an older Python
from `actions/setup-python`, needs to read what to change. The script itself can't say
it: an older Python may stop before the script's first line runs."""
fix = """Look at the first step of `action.yml`: it must fail on a Python older than the one
that `pyproject.toml` names, name the version it found, and stand before the step that
runs the script. Its cases are in `tests/test_templates.py`:"""
commands = ["python -m pytest tests/test_templates.py -k guard"]
docs = "docs/architecture/dry-runs.md#the-runners-that-the-action-is-tested-on"
autofix = """The text of the message and when it shows are a decision for a person."""

# ---------------------------------------------------------------- the job egress

[check."action behind the egress block"]
title = "The action against GitHub, behind the egress block"
problem = """A step of the job failed before its parts ran, such as the egress block of
Harden-Runner or the checkout of the pull request. When a part fails, the PR coach
explains that part instead: the dry runs of `sweep` and `sync-labels`, or the context
of a real issue."""
why = """The job runs the action of the pull request against GitHub itself, behind the
egress block of the templates and with a token that can only read: a request that
GitHub refuses, or a host that the action starts to need, fails here before a release
brings it to every repository."""
fix = """Run the check again; if it fails at the same step, the log of the check says
why."""
docs = "docs/architecture/testing.md#how-the-requests-to-github-are-tested"
autofix = """A step that fails before the parts needs a look at its log; each part
says in its own explanation how it is fixed."""

[check.egress-dry-runs]
title = "The dry runs of sweep and sync-labels against GitHub"
problem = """A dry run of `sweep` or of `sync-labels`, which read the issues, the pull
requests and the labels of this repository, failed. Either GitHub refused a request,
and the log shows its answer, or the egress block stopped a host other than
`api.github.com` and `github.com`, and the log names the host that the step couldn't
reach."""
why = """Every repository that uses the action runs these commands every morning,
behind the same block and with the same requests. A request that fails here fails
there after the next release, and its issues are no longer reminded, closed or
labeled."""
fix = """For a refused request, fix it in `issue_assistant.py`, with its case in
`tests/test_graphql_contract.py` or `tests/test_assistant.py`. For a blocked host, find
what calls it and make the action reach GitHub alone, as it turns off the telemetry of
the GitHub CLI; a new host for good is a change of the security design in
`docs/security.md`, which a maintainer decides. The dry runs run on your machine with
the GitHub CLI signed in:"""
commands = [
  "DRY_RUN=true GH_REPO={repo} python3 issue_assistant.py sweep",
  "DRY_RUN=true GH_REPO={repo} python3 issue_assistant.py sync-labels",
]
docs = "docs/architecture/testing.md#how-the-requests-to-github-are-tested"
autofix = """A request that GitHub refuses, or a host that the block stops, needs a
person, who knows what the action should ask of GitHub."""

[check.egress-context]
title = "The context of a real issue"
problem = """`context` failed for a closed issue of a public repository that uses the
action, wrote one of its files empty, or found that GitHub failed while it read the
corrections of the maintainers; the log names the file or the error."""
why = """`context` writes all that the AI reads for an issue: the issue, its labels,
the other issues and the discussions, the corrections and the rules. A file that comes
out empty here comes out empty for every first analysis after the next release, and
the AI answers without what it needs."""
fix = """Read the error in the log, and fix `context` in `issue_assistant.py`, with a
test in `tests/test_assistant.py`. It runs on your machine with the GitHub CLI signed
in, and writes its files into `.issue-assistant/`:"""
commands = [
  "GH_REPO=Dennis-Otto/homedarts-for-autodarts python3 issue_assistant.py context --issue 105 --mode triage",
]
docs = "docs/architecture/testing.md#how-the-requests-to-github-are-tested"
autofix = """What the AI should read of an issue is the decision of a person."""

# ---------------------------------------------------------------- the AI's runner in reserve

[check."the hosts for the AI's runner in reserve"]
title = "The hosts of the firewall policy for Harden-Runner"
problem = """`endpoints`, which the job event runs when `ISSUE_ASSISTANT_AI_RUNNER` names
another runner for the AI, failed for `ubuntu-24.04`, or a step before it did, such
as the checkout; the log names the error."""
why = """Without the hosts, the job analyze can't run on the runner in reserve, the one
that a repository moves the AI to when GitHub's egress-firewall runner is gone."""
fix = """Fix what the log names in `endpoints_command` of `issue_assistant.py`, with
its case in `tests/test_setup.py`. On your machine:"""
commands = [
  "ISSUE_ASSISTANT_AI_RUNNER=ubuntu-24.04 GITHUB_OUTPUT=/dev/stdout python3 issue_assistant.py endpoints",
]
docs = "docs/decisions/0019-a-runner-for-the-ai-when-the-firewall-runner-is-gone.md"
autofix = """An error of the command needs a person, who knows what it should name."""

[check."the AI's runner in reserve behind Harden-Runner"]
title = "The block of Harden-Runner on the AI's runner in reserve"
problem = """Behind Harden-Runner in block mode, with the hosts that `endpoints` names
from `.github/egress-firewall.yaml`, either requests to `example.com`, a host outside
the policy, still got through after a minute, or one to `registry.npmjs.org` on port
443 or to `azure.archive.ubuntu.com` on port 80, hosts of the policy, was blocked; the
log says which."""
why = """The job analyze runs behind exactly this block when a repository moves the AI
to the runner in reserve. A host that gets through lets the AI reach any host, and a
blocked host of the policy stops every analysis there."""
fix = """When `example.com` still got through, Harden-Runner blocked nothing: look at
its status and the log of its step. *Reverted changes* there means that its agent gave
up at its start, such as on an allowed host that it couldn't resolve: run the job again. When a host of the policy was blocked, compare the
endpoints in the log of the job before with `.github/egress-firewall.yaml`, and fix
`firewall_endpoints` in `issue_assistant.py`, with its case in
`tests/test_setup.py`."""
docs = "docs/decisions/0019-a-runner-for-the-ai-when-the-firewall-runner-is-gone.md"
autofix = """Whether a host may be reached is a decision of the security design, for a
person."""

# ---------------------------------------------------------------- the job schema

[check."GraphQL and REST against GitHub's current schemas"]
title = "The requests against GitHub's schema and description of today"
problem = """A GraphQL document or a REST request of `issue_assistant.py` uses something
that GitHub's schema or OpenAPI description of today deprecates or no longer has, such
as a field, a value of an enum, an operation or a query parameter, as the log of
`tests/test_graphql_contract.py` or `tests/test_rest_contract.py` names it, or the
download from docs.github.com or raw.githubusercontent.com failed. The summary of the
job shows what changed since the copies in `tests/github/`."""
why = """GitHub deprecates a part of its API months before it removes it. The weekly
run turns red as soon as the action uses something deprecated, while it still works,
so that a release moves away from it before every repository that uses the action
breaks."""
fix = """When the download failed, run the job again. Otherwise refresh the copies, run
the tests, and change each request that they name as GitHub's changelog recommends, in
one pull request:"""
commands = [
  "python3 scripts/github_schemas.py download tests/github",
  "python3 -m pytest tests/test_graphql_contract.py tests/test_rest_contract.py",
]
docs = "docs/architecture/testing.md#how-the-requests-to-github-are-tested"
autofix = """Copies that still pass come by themselves: the job after this one opens one
pull request from `bot/github-schemas`. A request that GitHub's schema no longer takes
needs a person, who chooses what replaces it; a fresh copy alone would only move the
failure into the required check."""

[check."the copies of GitHub's schemas in a pull request"]
title = "The pull request with the copies of GitHub's schemas"
problem = """The contract tests passed against GitHub's schema and description of today,
but the job couldn't bring the copies in `tests/github/` to the one pull request from
`bot/github-schemas`, couldn't turn on its automatic merge, or couldn't close that pull
request when `main` already has the copies: GitHub refused a request
or the token of the release app, as the log names it."""
why = """The copies stay behind what GitHub publishes, so the required check of every
pull request checks the requests against an older description. Nothing breaks until the
next weekly run, which tries again."""
fix = """Run the job again. When GitHub refuses the token, check the installation of the
release app and the secret `RELEASE_AUTOMATION_PRIVATE_KEY` of the environment `release`.
The copies can also go into a pull request by hand:"""
commands = [
  "python3 scripts/github_schemas.py download tests/github",
  "python3 -m pytest tests/test_graphql_contract.py tests/test_rest_contract.py",
]
docs = "docs/architecture/testing.md#how-the-requests-to-github-are-tested"
autofix = """A failed request to GitHub or a refused token needs another run or a look at
the app, not a change of the repository."""

# ---------------------------------------------------------------- the job engines

[check."engine contracts"]
title = "The names that keep each engine to reading"
problem = """A step of the check of the engine contracts failed before its parts ran,
such as the checkout of the pull request, or the block of Harden-Runner stopped a host
other than `api.github.com`, `github.com` and `registry.npmjs.org`. When a part fails,
the PR coach explains that part instead: the files of the pull request, the actions of
the engines or their command lines."""
why = """The check runs the pinned versions of the engines without a key, the only
check that does before a release brings them to every repository that uses the
action."""
fix = """Run the check again; if it fails at the same step, the log of the check says
why."""
docs = "docs/architecture/testing.md#how-the-names-of-the-engines-are-checked"
autofix = """A step that fails before the parts needs a look at its log; each part
says in its own explanation how it is fixed."""

[check.engine-changes]
title = "The files of the pull request"
problem = """GitHub listed no files of the pull request, so the check couldn't tell
whether it changes the step of an engine or what the check reads; the log names
GitHub's answer."""
why = """Without the list, the check runs the engines' actions and command lines as
on a pull request that changes them, and only this part fails."""
fix = """Run the check again; GitHub's API was most likely down for a moment."""
commands = [
  "PR=<number> GITHUB_REPOSITORY={repo} python3 scripts/engine_contract.py changes",
]
docs = "docs/architecture/testing.md#how-the-names-of-the-engines-are-checked"
autofix = """A failed request to GitHub needs another run, not a change of the
repository."""

[check.engine-actions]
title = "The inputs and outputs of the engines' actions"
problem = """A step of an engine passes an input that its action, at the commit that
the workflow pins, doesn't have or deprecates, or leaves out one that the action
requires, or its job reads an output that the action doesn't have; the log names the
workflow, the step, the action and the name. Or openai/codex-action no longer says
that it selects the permission profile through `default_permissions` of Codex's
configuration."""
why = """GitHub only warns about an input that an action doesn't have and runs the
step without it: Codex would run without the sandbox of `permission-profile`, which
keeps it to reading. An output that the action renamed turns into an empty answer in
every repository that uses the action."""
fix = """Read the release notes of the action and its `action.yml` at the new commit,
and pass the input by its new name in `.github/workflows/reusable-issue-assistant.yml`
and `reusable-discussion-assistant.yml`, with its rules in `ENGINE_RULES` of
`tests/test_templates.py`, or keep the old pin until it is clear what replaces it. The
check runs on your machine with the GitHub CLI signed in:"""
commands = [
  "python3 scripts/engine_contract.py actions",
]
docs = "docs/security/engines.md#the-boundary-of-each-engine"
autofix = """A renamed input of an engine's action can change its security boundary,
so a person decides what replaces it; no bot moves the read-only boundary of an
engine."""

[check.engine-clis]
title = "The flags and settings of the engines' command lines"
problem = """A command line of an engine, at the version that the workflow pins,
doesn't list a flag of its step in its `--help` or doesn't take its value, the JSON
schema of the Gemini CLI's settings of that version doesn't have a key of `settings`
in `ENGINES` of `issue_assistant.py`, or a run without a key stopped at something other
than the key or complained about its settings, or a run with broken settings in the
file that the Gemini CLI's variable names didn't refuse them. Or npm couldn't
verify a signature of npm's registry or an attestation of a package that it installed
from a lock file in `engines/` on the runner, or it installed the command line from a copy of the lock file with
another hash of it. The log names the version, the flag, the key, the package or what
it printed."""
why = """The Gemini CLI ignores a key of its settings that it doesn't know, and skips
its settings in a folder that others may write to, Codex ignores a key of its
configuration that it doesn't know, and a flag that the help doesn't list can go in
the next release: each would run the engine without the rule that keeps it to
reading, without a failure. A package of a lock file whose signature doesn't verify
may not be what its author published, and `analyze` installs it with the engine's
secret in every repository."""
fix = """Read the release notes of the command line and change the flag or the key in
`ENGINES` of `issue_assistant.py`, with its test in `tests/test_engines.py` and the
rows in `docs/security/engines.md`, or keep the old pin until it is clear what replaces it. A
run that stopped elsewhere shows in the log what the command line printed. A
signature that doesn't verify is no flake: don't merge the update, keep the lock file
of `main`, and report the package to npm. The check
runs on Linux or macOS, with npm, the GitHub CLI signed in and sudo, which writes the
Gemini CLI's settings as root:"""
commands = [
  "sudo -v",
  "python3 scripts/engine_contract.py clis",
]
docs = "docs/security/engines.md#the-boundary-of-each-engine"
autofix = """A renamed flag or key of an engine's command line can change its
security boundary, so a person decides what replaces it; no bot moves the read-only
boundary of an engine."""

# ---------------------------------------------------------------- the fuzzing

[check.fuzz]
title = "The fuzzing"
problem = """Atheris found an input that one of the targets in `fuzz/` fails on: the
reading of issues, the cleaning of the AI's text or a whole comment raises an
exception, lets through a text that `tests/oracle.py` judges unsafe, or stays busy for
too long. The log of the target shows the input, also as Base64, and the
traceback."""
why = """Anyone can write an issue, and the AI's answer is untrusted too: an input that
crashes the reading or the cleaning stops the analysis of that issue, and one that
slips past the cleaning reaches a comment."""
fix = """Write the input of the log into a file, run the target that the log names
with it to see the failure, and fix the code. Add the input to a test in
`tests/test_properties.py` or `tests/test_assistant.py`, so that the failure can't come
back, and to the seeds of the target in `fuzz/corpus/` when it helps the fuzzing. The
targets run on your machine with Atheris, on Python 3.12:"""
commands = [
  "pip install --require-hashes -r requirements-fuzz.txt",
  "echo 'the Base64 of the log' | base64 -d > crash",
  "python fuzz/fuzz_sanitize.py crash  # or the target that the log names",
]
docs = "https://github.com/google/atheris"
autofix = """A failure that fuzzing finds needs a fix of the code, and a test with its
input, by a person."""

# ---------------------------------------------------------------- the Workflow test

[check."reusable workflows"]
title = "The reusable workflows as dry runs"
problem = """A reusable workflow of `.github/workflows/reusable-*.yml`, which every
repository that uses the action calls, didn't run as the Workflow test called it: a
job failed, a job that has to run was skipped or is missing, a job that has to be
skipped ran, or the step that writes the plan of its dry run didn't pass. The table in
the summary of this check names each job, and the job's own check shows why it
failed, such as a wrong `needs`, `if` or output, a missing permission, or the guard
that stops a job when GitHub names no commit of its workflow."""
why = """The tests and actionlint only read the reusable workflows, and the Action test
runs the action by itself. A job that fails or skips its work here fails or does
nothing in every repository after the next release, often without a red run: a job
that its condition skips passes."""
fix = """Open the check of the job that the table names, fix the reusable workflow or
the action, and keep the names of `CALLS` in `scripts/workflow_test.py` in step with
the jobs and steps when you rename one; `tests/test_workflow_test.py` checks them.
The tests of the workflows run on your machine:"""
commands = [
  "python3 -m pytest tests/test_workflow_test.py tests/test_templates.py",
]
docs = "docs/architecture/dry-runs.md#the-workflow-test"
autofix = """A job that doesn't run as it should needs a person, who knows what the
reusable workflow should do; no bot changes a workflow that every repository runs."""

# ---------------------------------------------------------------- the Canary

[check."the AI's wait for its runner"]
title = "The wait of the AI for its runner"
problem = """The job `analyze` of the Canary waited for longer than 30 minutes for its
runner, or still waits: the summary of the job says how long. The AI runs on
`ubuntu-24.04-firewall`, GitHub's runner with the egress firewall, which is a
technical preview; GitHub may have renamed or ended it, or the account lost it. On
`main` the job opened the issue of the bot-health bot for the Canary, which closes
when a Canary passes again."""
why = """A job that finds no runner waits in the queue for up to a day, and its
timeout counts only from its start. Every later run of the same issue waits behind
it, so no issue in any repository that uses the action gets an analysis, a
follow-up or a reply after a release while the runner is gone."""
fix = """Look at the README of the preview for a new label or its end. Until a release
of the action moves to the new runner, a repository names another one for the AI in
its variable `ISSUE_ASSISTANT_AI_RUNNER`, such as `ubuntu-24.04`, where Harden-Runner
blocks every host but those of `.github/egress-firewall.yaml`; decision 0019 says
what that changes. Set it in `[variables]` of `.github/repository.project.toml`,
which the settings bot applies, or on GitHub, and run the Canary again:"""
commands = [
  "gh variable set ISSUE_ASSISTANT_AI_RUNNER --body ubuntu-24.04 --repo {repo}",
  "gh workflow run canary.yml --repo {repo}",
]
docs = "docs/decisions/0019-a-runner-for-the-ai-when-the-firewall-runner-is-gone.md"
autofix = """Which runner the AI may use instead is a decision of the security of
every repository that uses the action, for a person; a wait for a runner has no fix
in the code."""

# ---------------------------------------------------------------- the Evaluate workflow

[check."replay closed issues"]
title = "The replay of closed issues (Evaluate workflow)"
problem = """The job with the AI of the Evaluate workflow stopped before it had a report:
the log of the failed step says why, such as a repository without
`.github/labels.toml`, an environment without the engine's secret, or a number of
issues outside 1 to 200. Only a run by hand starts it, on `main`."""
why = """The numbers of `docs/accuracy.md` show how far the analyses can be trusted, and
this job measures them. Without a report the page keeps its older numbers, and no
repository gets worse for it."""
fix = """Fix what the log names and start the run again; each issue costs about $0.20
with Opus at the prices of the API, so try a small number first:"""
commands = [
  "gh workflow run evaluate.yml --repo {repo} -f repository=Dennis-Otto/paperless-sync -f issues=3",
]
docs = "docs/accuracy.md#how-the-numbers-get-here"
autofix = """A run that failed costs money each time it runs again, so a person looks at
it first; no bot starts it."""

[check."publish the numbers"]
title = "The numbers of the accuracy page (Evaluate workflow)"
problem = """The job without an AI of the Evaluate workflow couldn't bring the numbers of
the report into the pull request: the log names the step. `accuracy-page` refuses a
report whose head isn't what `evaluate` writes, one that names another repository than
the run measured, one in which every analysis failed, such as with a wrong token or a
blocked host, or a page without its block of numbers; a token of the release app may have lost a permission, or a commit of the
branch may have come in between."""
why = """A report that doesn't fit could carry text from the job with the AI into the
website, so the job stops rather than publish it."""
fix = """A commit in between goes away with a run of the failed job again. A refused
report needs a look at the artifact `accuracy` of the run: when every analysis failed,
its lines and the log of the job replay name why, and the page keeps its older numbers
until a run after the fix; when `render_evaluation`
changed the head of a report, `REPORT` of `issue_assistant.py` follows it. The tests
of the two run without an AI:"""
commands = [
  "python3 -m pytest tests/test_evaluate.py -k accuracy",
  "gh run rerun --failed --repo {repo} RUN",
]
docs = "docs/accuracy.md#how-the-numbers-get-here"
autofix = """Whether a report that doesn't fit is a change of the report or an attempt to
reach the website is for a person to decide, so no command fixes it."""
