name: Canary

# The path of an issue through the AI, end to end, as every repository that uses
# the action runs it: a call of the reusable workflow
# .github/workflows/reusable-issue-assistant.yml that passes the engine's secrets by
# name, its job analyze with their values from the environment issue-assistant and
# the variable ISSUE_ASSISTANT_AI of the repository, the engine on GitHub's
# egress-firewall runner, its structured answer, and apply, which checks that
# answer. The tests and the Action test reach neither the engine, the outputs of its
# action, the hosts of the firewall, the secret nor the variables of a caller, and
# this repository gets few issues, so a broken path would show first as issues
# without an answer in every repository that uses the action. The job queue
# measures how long analyze waits for the runner with the firewall, a technical
# preview, and fails when it waits for longer than 30 minutes.
#
# The issue is tests/fixtures/canary-issue.json, which exists nowhere on GitHub: the
# input canary of the reusable workflow, which only this repository may pass, gives
# it to context and apply in place of a real one through ISSUE_ASSISTANT_FIXTURE,
# which makes apply a dry run whose summary shows the comment it would post. The job
# event sets no labels for it, so nothing is written to an issue.
#
# Every Monday, after every change on main of what the path runs, and by hand. Only
# main may use the secret of the environment, so no pull request runs the canary;
# an update of the engine's action waits for the maintainer, who watches its run
# after the merge (.github/renovate.json5). docs/architecture.md describes it.

on:
  schedule:
    - cron: "23 7 * * 1"
  push:
    branches: [main]
    paths:
      - action.yml
      - issue_assistant.py
      - prompts/**
      - locales/**
      - .github/workflows/reusable-issue-assistant.yml
      - templates/.github/egress-firewall.yaml
      # The settings that this repository's analyses use, and the firewall policy
      # that the runner enforces here.
      - .github/egress-firewall.yaml
      - .github/issue-assistant/**
      - .github/labels.toml
      - .github/workflows/canary.yml
      - scripts/canary_queue.py
      - tests/fixtures/canary-issue.json
  workflow_dispatch:

permissions: {}

jobs:
  # The engine's action runs for a schedule or a run by hand, not for a push. So a
  # push starts the canary as a run by hand, which the job's token may start, and
  # waits for its result. GitHub mails a failed run to the person who started it:
  # a run that the job's token started has none, but the push run fails with it,
  # and its mail reaches the person who merged.
  start:
    name: Start the canary for the new main and wait for its result
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Long enough for a canary that waits for an earlier one, then its own jobs.
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Start the canary and wait for its result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TELEMETRY: "false"
        run: |
          # GitHub answers with the number of the run that it started.
          run=$(gh api --method POST "repos/$GH_REPO/actions/workflows/canary.yml/dispatches"             -f ref="$GITHUB_REF_NAME" -F return_run_details=true --jq .workflow_run_id)
          if [[ -z "$run" ]]; then
            echo "::warning::GitHub started the canary without naming its run; its result is under Actions."
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run"
          echo "The canary runs at $url"
          gh run watch "$run" --interval 60 > /dev/null
          conclusion=$(gh run view "$run" --json conclusion --jq .conclusion)
          case "$conclusion" in
            success) echo "The canary passed." ;;
            # A later push's canary took the place of this waiting one.
            cancelled) echo "::notice::The canary was cancelled; a later one checks main: $url" ;;
            *)
              echo "::error::The canary ended as $conclusion: $url"
              exit 1
              ;;
          esac

  # The call of the template templates/.github/workflows/issue-assistant.yml, as in
  # every repository that uses the action: its name, its permissions and the
  # engine's secrets by name, which a test keeps equal to the template's. Only the
  # workflow is that of this commit, and the input canary gives its jobs the issue
  # of the file, makes apply a dry run and fails where a repository's run would
  # skip the AI. The token of apply may write, as everywhere, but writes nothing.
  assistant:
    name: Issue assistant
    if: github.event_name != 'push'
    # One canary at a time; the job, not the run, waits, so that a push never waits
    # for a canary to start the next one.
    concurrency:
      group: canary
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      discussions: read
    # The workflow of this commit; actionlint doesn't know the self-repository
    # syntax $/ yet (decision 0015).
    uses: ./.github/workflows/reusable-issue-assistant.yml # zizmor: ignore[self-repository]
    with:
      canary: true
      dry_run: true
    # Passed by name: only the job analyze sees their values, those of the
    # environment issue-assistant, which only the default branch may use.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  # The AI runs on GitHub's egress-firewall runner, a technical preview. Should
  # GitHub rename or end it, analyze waits in the queue, up to a day, and every
  # later run of an issue waits behind it, in every repository. This job reads the
  # jobs of its run beside the call, until analyze starts, and shows the wait in its
  # summary: a warning above 10 minutes, a failure above 30, also while analyze
  # still waits. On the default branch it then opens the issue of bot-health for the
  # Canary, since the run ends, and GitHub mails its failure, only when analyze does.
  # scripts/canary_queue.py says when the wait starts.
  queue:
    name: the AI's wait for its runner
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # Long enough for a call that waits for an earlier canary, then 30 minutes.
    timeout-minutes: 80
    permissions:
      actions: read
      issues: write
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/canary_queue.py
            /.github/
          sparse-checkout-cone-mode: false
      - name: Measure the wait of analyze for its runner
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TELEMETRY: "false"
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/canary_queue.py
      # The run, and with it GitHub's mail and bot-health, ends only when analyze does,
      # up to a day later: this issue tells at once.
      - name: Open the issue of bot-health
        if: >-
          failure() && steps.measure.outcome == 'failure'
          && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TELEMETRY: "false"
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE: ${{ steps.measure.outputs.line }}
        run: python3 scripts/canary_queue.py alarm
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the job and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: the AI's wait for its runner
        run: python3 .github/blueprint.py coach explain "$CHECK"
