name: Issue assistant

# The jobs of templates/.github/workflows/issue-assistant.yml, which every repository
# that uses the issue assistant calls at the commit of a release. A new release
# reaches a repository as a move of that pin, without running install again.
# https://github.com/Dennis-Otto/issue-assistant
#
# event    no AI: labels, the /assistant commands of a comment and the next task
# analyze  the AI engine of .github/issue-assistant/config.toml reads the checkout and
#          a context folder and answers with JSON; read-only token, read-only tools,
#          egress-firewall runner (the caller's .github/egress-firewall.yaml), or the
#          runner of the caller's variable ISSUE_ASSISTANT_AI_RUNNER with the same
#          hosts behind Harden-Runner
# apply    no AI: checks the engine's answer and is the only job that writes
#
# event and apply block every host but GitHub's with Harden-Runner. A called
# workflow runs in the caller's repository: its event, its variables, its
# environments, its runners and its firewall policy. Each job runs the issue
# assistant of this workflow's own commit, which it checks out next to the
# repository; decision 0015 says why.
#
# The Canary of the issue assistant, .github/workflows/canary.yml, calls it as every
# repository does, with the input canary: the issue of tests/fixtures/canary-issue.json
# in place of that of an event, no labels, apply as a dry run, and a failure wherever
# a repository's run would skip the AI. Every step and value of the canary names
# inputs.canary, which every other caller leaves false; docs/architecture.md
# describes it.
#
# The Workflow test, .github/workflows/workflow-test.yml, calls it on every pull
# request that changes what it runs, with the input smoke: the same issue, no AI, and
# apply as a dry run of the answer of tests/fixtures/smoke-answer.json in place of the
# engine's. Every step and value of the smoke test names inputs.smoke, which every
# other caller leaves false too.

on:
  workflow_call:
    inputs:
      dry_run:
        description: Only show what the assistant would do
        type: boolean
        default: false
      canary:
        description: Only for the Canary of the issue assistant, in its own repository; analyze the issue of tests/fixtures/canary-issue.json as a dry run, and fail where a run would skip the AI
        type: boolean
        default: false
      smoke:
        description: Only for the Workflow test of the issue assistant, in its own repository; check the answer of tests/fixtures/smoke-answer.json for the issue of tests/fixtures/canary-issue.json as a dry run, without the AI
        type: boolean
        default: false
    # The caller passes the engine's secrets by name. Only the job analyze sees their
    # values, those of the caller's environment issue-assistant.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: The OAuth token of Claude Code, for the engine claude
        required: false
      ANTHROPIC_API_KEY:
        description: The API key of Anthropic, for the engine claude
        required: false
      OPENAI_API_KEY:
        description: The API key of OpenAI, for the engine codex
        required: false
      GEMINI_API_KEY:
        description: The API key of the Gemini API, for the engine gemini
        required: false
      COPILOT_GITHUB_TOKEN:
        description: A fine-grained token with the permission Copilot Requests, for the engine copilot
        required: false

permissions: {}

jobs:
  event:
    name: Handle the event
    # The canary runs for a schedule too, whose sender GitHub may name a bot, and the
    # smoke test for a pull request, also one of Renovate.
    if: >-
      !github.event.repository.fork &&
      (inputs.canary || inputs.smoke || github.event_name == 'workflow_dispatch' ||
        (!github.event.issue.pull_request &&
         github.event.sender.type != 'Bot' &&
         (github.event.action != 'edited' ||
          github.event.sender.login == github.event.issue.user.login)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # discussions: read for the limits of the day, which count the new discussions
    # that get a first answer too.
    permissions:
      contents: read
      issues: write
      discussions: read
    outputs:
      # The canary and the smoke test name no issue: context and apply take that of
      # their file.
      issue: ${{ steps.event.outputs.issue }}
      mode: ${{ steps.event.outputs.mode || steps.canary.outputs.mode || steps.smoke.outputs.mode }}
      # The endpoints of Harden-Runner for analyze, on the runner of
      # ISSUE_ASSISTANT_AI_RUNNER alone.
      endpoints: ${{ steps.endpoints.outputs.endpoints }}
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      # Issue events always run the workflow and the settings of the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit of this workflow, which the caller pins. actionlint 1.7.12 doesn't
      # know job.workflow_repository and job.workflow_sha yet, which toJSON hides,
      # nor the self-repository syntax $/, which would need no checkout.
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant.py
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The smoke test checks the answer of a file for the canary's issue, which
      # only the issue assistant's own repository has, and sets no labels.
      - name: Take the issue of the smoke test
        id: smoke
        if: inputs.smoke
        env:
          CALLER: ${{ github.repository }}
          WORKFLOW: ${{ fromJSON(toJSON(job)).workflow_repository }}
        run: |
          if [[ "${CALLER,,}" != "${WORKFLOW,,}" ]]; then
            echo "::error::Only the Workflow test of $WORKFLOW may pass the input smoke, not $CALLER."
            exit 1
          fi
          echo "The smoke test checks the answer of tests/fixtures/smoke-answer.json for the issue of tests/fixtures/canary-issue.json, without the AI."
          echo "mode=triage" >> "$GITHUB_OUTPUT"
      # The canary's task is an analysis of the issue of its file, which only the
      # issue assistant's own repository has. The settings bot sets the variable to
      # on there, so a called workflow that sees no value doesn't see the variables
      # of its caller.
      - name: Take the canary's issue
        id: canary
        if: inputs.canary
        env:
          CALLER: ${{ github.repository }}
          WORKFLOW: ${{ fromJSON(toJSON(job)).workflow_repository }}
          AI: ${{ vars.ISSUE_ASSISTANT_AI }}
        run: |
          if [[ "${CALLER,,}" != "${WORKFLOW,,}" ]]; then
            echo "::error::Only the Canary of $WORKFLOW may pass the input canary, not $CALLER."
            exit 1
          fi
          if [[ -z "$AI" ]]; then
            echo "::error::The called workflow doesn't see the variable ISSUE_ASSISTANT_AI of $CALLER, which its settings set to on: do the variables of a caller still reach a reusable workflow?"
            exit 1
          fi
          if [[ "$AI" == off ]]; then
            echo "::error::ISSUE_ASSISTANT_AI is off, which skips the AI that the canary runs; set it to on in .github/repository.toml."
            exit 1
          fi
          echo "The canary analyzes the issue of tests/fixtures/canary-issue.json."
          echo "mode=triage" >> "$GITHUB_OUTPUT"
      - name: Set labels and choose the next task
        id: event
        if: ${{ !inputs.canary && !inputs.smoke }}
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: event
          dry-run: ${{ inputs.dry_run }}
      # The AI runs on GitHub's egress-firewall runner, a technical preview, or on
      # the runner that the variable ISSUE_ASSISTANT_AI_RUNNER names in its place,
      # such as ubuntu-24.04, should GitHub rename or end it. There Harden-Runner
      # blocks every host but those of .github/egress-firewall.yaml, which this step
      # names for it, and fails on a runner where nothing would block them; decision
      # 0019 says why.
      - name: Name the hosts of the firewall policy for the AI's runner
        id: endpoints
        if: vars.ISSUE_ASSISTANT_AI_RUNNER != '' && vars.ISSUE_ASSISTANT_AI_RUNNER != 'ubuntu-24.04-firewall'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        env:
          ISSUE_ASSISTANT_AI_RUNNER: ${{ vars.ISSUE_ASSISTANT_AI_RUNNER }}
        with:
          command: endpoints

  analyze:
    name: Analyze with the AI engine
    needs: event
    # The smoke test runs no engine: apply takes the answer of its file.
    if: >-
      !inputs.smoke &&
      needs.event.outputs.mode != '' &&
      needs.event.outputs.mode != 'none' &&
      vars.ISSUE_ASSISTANT_AI != 'off'
    # GitHub's egress-firewall runner, or the one that the repository names in its
    # place; the job event checks it.
    runs-on: ${{ vars.ISSUE_ASSISTANT_AI_RUNNER || 'ubuntu-24.04-firewall' }}
    timeout-minutes: 20
    # The engine's secret belongs to this environment of the caller, limited to the
    # default branch; no deployment is recorded for a run.
    environment:
      name: issue-assistant
      deployment: false
    permissions:
      contents: read
      issues: read
      discussions: read
    outputs:
      engine: ${{ steps.engine.outputs.engine }}
      # One answer per engine step; only the chosen engine runs.
      answer: ${{ steps.claude.outputs.structured_output || steps.codex.outputs.final-message || steps.gemini.outputs.answer || steps.copilot.outputs.answer }}
    steps:
      # Only on the runner of ISSUE_ASSISTANT_AI_RUNNER: Harden-Runner blocks every
      # host but those of the firewall policy for this job, as the firewall does for
      # the whole machine of its runner. The engines need sudo, to install what
      # isolates them, and run no command that could lift the block.
      - name: Block every host but those of the firewall policy
        if: vars.ISSUE_ASSISTANT_AI_RUNNER != '' && vars.ISSUE_ASSISTANT_AI_RUNNER != 'ubuntu-24.04-firewall'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ needs.event.outputs.endpoints }}
      # Harden-Runner fails open: it blocks nothing in a private repository without
      # a subscription of StepSecurity, or when its service is down. Then the AI
      # doesn't run.
      - name: Make sure that the block holds
        if: vars.ISSUE_ASSISTANT_AI_RUNNER != '' && vars.ISSUE_ASSISTANT_AI_RUNNER != 'ubuntu-24.04-firewall'
        run: |
          if curl --silent --max-time 10 --output /dev/null https://example.com; then
            echo "::error::Harden-Runner let a request to example.com through, a host outside .github/egress-firewall.yaml, so the AI doesn't run. In a private repository it blocks only with a subscription of StepSecurity; unset ISSUE_ASSISTANT_AI_RUNNER for the egress-firewall runner, or set ISSUE_ASSISTANT_AI to off."
            exit 1
          fi
          echo "Harden-Runner blocks example.com, a host outside .github/egress-firewall.yaml."
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the context folder, which .gitignore leaves out of the checkout's files.
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant.py
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The engine and what a run of the task may use: its model, turns, dollars and
      # effort, from config.toml.
      - name: Choose the engine and check its secret
        id: engine
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: engine
          mode: ${{ needs.event.outputs.mode }}
          # One entry per engine: its key when its secret exists.
          ready-engines: >-
            ${{ format('{0},{1},{2},{3}',
            (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') && 'claude' || '',
            (secrets.OPENAI_API_KEY != '') && 'codex' || '',
            (secrets.GEMINI_API_KEY != '') && 'gemini' || '',
            (secrets.COPILOT_GITHUB_TOKEN != '') && 'copilot' || '') }}
      - name: Collect the issue, earlier issues and discussions
        id: context
        if: steps.engine.outputs.ready == 'true'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        # The canary's issue in place of one on GitHub; empty, the variable is unset.
        env:
          ISSUE_ASSISTANT_FIXTURE: ${{ inputs.canary && 'tests/fixtures/canary-issue.json' || '' }}
        with:
          command: context
          issue: ${{ needs.event.outputs.issue }}
          mode: ${{ needs.event.outputs.mode }}

      # The engines. Each one gets the rules before its task and the JSON schema,
      # may only read files of the checkout and returns the JSON answer.

      - name: Analyze with Claude
        id: claude
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Issues come from people without write access. The token is the job's
          # read-only GITHUB_TOKEN, and Claude can only read files of the checkout.
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          # A bot may start the canary: its job start, or an app that last changed
          # its schedule. No bot starts the engine of any other run, the default of
          # the action.
          allowed_bots: ${{ inputs.canary && '*' || '' }}
          prompt: ${{ steps.context.outputs.task }}
          # --restricted removes every tool that runs code or reaches the network,
          # ignores settings files and confines the file tools to the checkout;
          # --tools leaves only the reading tools, which never see the issue
          # assistant's own checkout, and nothing ever prompts. The rules come
          # first, as the system prompt, and the task stops at its turns and
          # dollars.
          claude_args: |
            --restricted
            --tools "Read,Grep,Glob"
            --disallowedTools "Read(./.issue-assistant/action/**)"
            --permission-prompts none
            --append-system-prompt-file .issue-assistant/rules.md
            --model ${{ steps.engine.outputs.model }}
            --max-turns ${{ steps.engine.outputs.turns }}
            --max-budget-usd ${{ steps.engine.outputs.budget }}
            ${{ steps.engine.outputs.effort && format('--effort {0}', steps.engine.outputs.effort) || '' }}
            --json-schema '${{ steps.context.outputs.schema }}'
      - name: Analyze with Codex
        id: codex
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'codex'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        # The action prints what Codex prints into the log, where the runner reads
        # each line that starts with :: as a workflow command. With --json from the
        # context step, Codex prints only JSON events, one per line, and RUST_LOG
        # turns off its log, so no text of an issue or of Codex starts a line.
        env:
          RUST_LOG: "off"
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # renovate: datasource=npm depName=@openai/codex
          codex-version: "0.162.1"
          # Issues come from people without write access. The sandbox of the
          # profile :read-only lets Codex read files but neither write them nor
          # reach the network, and drop-sudo leaves the API key to the proxy of the
          # action, out of Codex's reach. The context step's arguments give it the
          # rules as its developer instructions and turn off its web search, and
          # its strict schema shapes the answer.
          allow-users: "*"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .issue-assistant/prompt.md
          output-schema-file: .issue-assistant/schema.json
          codex-args: ${{ steps.context.outputs.engine-args }}
          model: ${{ steps.engine.outputs.model }}
          effort: ${{ steps.engine.outputs.effort }}
      # The Gemini CLI and the Copilot CLI have no action that keeps them to reading,
      # so the issue assistant runs them, with only their tools that read files of
      # the checkout and no token of GitHub (decision 0017).
      - name: Analyze with Gemini
        id: gemini
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'gemini'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          command: analyze
          mode: ${{ needs.event.outputs.mode }}
          engine: gemini
      - name: Analyze with Copilot
        id: copilot
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'copilot'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          command: analyze
          mode: ${{ needs.event.outputs.mode }}
          engine: copilot
      # Numbers alone, also after a failure: the turns, time, cost and tokens of
      # the run, in the summary of the job.
      - name: Report what the analysis cost
        id: usage
        if: always() && steps.claude.outputs.execution_file != ''
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: usage
          issue: ${{ needs.event.outputs.issue }}
          mode: ${{ needs.event.outputs.mode }}
          execution-file: ${{ steps.claude.outputs.execution_file }}
      # A repository's run skips apply without the engine's secret or without an
      # answer; the canary fails, since either is what it watches for: a secret
      # that expired or no longer reaches this job, or a renamed output of the
      # engine's action.
      - name: Check that the engine answered the canary
        if: inputs.canary
        env:
          READY: ${{ steps.engine.outputs.ready }}
          ENGINE: ${{ steps.engine.outputs.engine }}
          ANSWER: ${{ steps.claude.outputs.structured_output || steps.codex.outputs.final-message || steps.gemini.outputs.answer || steps.copilot.outputs.answer }}
        run: |
          if [[ "$READY" != true ]]; then
            echo "::error::The job analyze got no secret of the engine $ENGINE from the environment issue-assistant, which the caller passes by name."
            exit 1
          fi
          if [[ -z "$ANSWER" ]]; then
            echo "::error::The engine gave no structured answer; did its action rename its output, or did it fail?"
            exit 1
          fi
          echo "The engine answered with ${#ANSWER} characters of JSON."

  apply:
    name: Check and post the analysis
    needs: [event, analyze]
    # After an answer of the engine, or in the smoke test, which skips analyze, with
    # the answer of its file; written out, what GitHub otherwise adds: both jobs
    # passed.
    if: >-
      !cancelled() && needs.event.result == 'success' &&
      (inputs.smoke ||
        (needs.analyze.result == 'success' && needs.analyze.outputs.answer != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      discussions: read
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant.py
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The answer of the smoke test, in place of the engine's, from the caller's
      # checkout: only the issue assistant's own repository has the file.
      - name: Take the answer of the smoke test
        id: smoke
        if: inputs.smoke
        run: |
          answer="$(jq --compact-output . tests/fixtures/smoke-answer.json)"
          echo "answer=$answer" >> "$GITHUB_OUTPUT"
      - name: Check the engine's answer and post it
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        # With the canary's issue, apply is a dry run whose summary shows the comment.
        env:
          ISSUE_ASSISTANT_FIXTURE: ${{ (inputs.canary || inputs.smoke) && 'tests/fixtures/canary-issue.json' || '' }}
        with:
          command: apply
          issue: ${{ needs.event.outputs.issue }}
          mode: ${{ needs.event.outputs.mode }}
          engine: ${{ needs.analyze.outputs.engine }}
          answer: ${{ needs.analyze.outputs.answer || steps.smoke.outputs.answer }}
          dry-run: ${{ inputs.dry_run }}
