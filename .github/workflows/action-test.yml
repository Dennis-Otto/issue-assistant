name: Action test

# The templates in templates/, which every repository that uses the action gets,
# pass actionlint and zizmor. Then the action runs as its users run it, on the
# runner of the templates and on the two others that the README names, whose images
# differ, as ubuntu-latest and the free ARM runners do from the runner of the
# templates: installed into the sample repository and into a copy of this repository,
# whose set-ups it checks, and behind the egress block of the templates. The legs
# run side by side, so they add no time to the check, and the leg on the runner of
# the templates keeps the name of the job, which main requires. The block of the AI's
# runner in reserve holds, and on a Python that is too old the action stops with its
# message. The action runs on the runner's own Python, without installing PyYAML:
# check falls back to yq where the image has no PyYAML, and it runs once with PyYAML
# hidden on every leg, so that each image's yq really reads the set-up. The commands
# that only read run against GitHub itself, and every week the GraphQL documents and
# the REST requests of the script meet GitHub's schema and description of that day, so
# that a field that GitHub deprecates fails here months before GitHub removes it, and
# copies that are behind but still pass come in a pull request. The names that keep each
# engine to reading, such as the inputs of its action and the flags of its command
# line, meet the versions that the workflows pin, on a pull request that changes an
# engine and every week, so that an update that renames one fails before a release.
#
# Each part of a job runs also when one before it failed, so that the check reports
# every failure at once, and the last step of each job lets the PR coach explain each
# part that failed, from .github/checks.project.toml: in the summary of the check, as
# its annotation and in the one comment on the pull request, also on one from a fork.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  action:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      # Every leg reports, so that a failure shows on the runners where it happens.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check: action
          - runner: ubuntu-26.04
            check: action (ubuntu-26.04)
          - runner: ubuntu-24.04-arm
            check: action (ubuntu-24.04-arm)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # The Lint workflow lints this repository's own workflows only. actionlint
      # 1.7.12, the newest release, doesn't know the queue of a concurrency group,
      # which GitHub has documented since 2026-05-07; only that message is ignored.
      # actionlint's problem matcher, as in the Lint workflow, shows each error as an
      # annotation at its line, in the files of the pull request and in the comment
      # of the PR coach too. What it finds doesn't depend on the runner, so one leg
      # is enough.
      - name: Lint the templates
        id: template-lint
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.runner == 'ubuntu-24.04' }}
        env:
          ACTIONLINT: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          cat > "$RUNNER_TEMP/actionlint.json" <<'EOF'
          {"problemMatcher": [{"owner": "actionlint", "pattern": [{"regexp": "^(.+?):(\\d+):(\\d+): (.+) \\[(.+)\\]$", "file": 1, "line": 2, "column": 3, "message": 4, "code": 5}]}]}
          EOF
          echo "::add-matcher::$RUNNER_TEMP/actionlint.json"
          docker run --rm --volume "$PWD:/repo" --workdir /repo "$ACTIONLINT" \
            -config-file .github/actionlint.yaml \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            templates/.github/workflows/*.yml
      # The Workflow security workflow reports zizmor's findings to code scanning;
      # a finding in the templates fails this check, before any repository gets it.
      # The log names the files of a finding; annotations would name them relative
      # to templates/, as this repository's own workflows.
      - name: Check the security of the templates
        id: template-security
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.runner == 'ubuntu-24.04' }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: templates
          config: .github/zizmor.yml
          advanced-security: false
      - name: Install the action into the sample repository
        id: sample-install
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/sample
        run: |
          cp -r tests/sample "$ISSUE_ASSISTANT_ROOT"
          python3 -m issue_assistant install --ref "$GITHUB_SHA" --version smoke-test
          mkdir "$RUNNER_TEMP/no-pyyaml"
          echo 'raise ImportError' > "$RUNNER_TEMP/no-pyyaml/yaml.py"
      - name: Check the sample's set-up through the action
        id: sample-check
        if: ${{ !cancelled() && steps.sample-install.outcome == 'success' }}
        uses: ./
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/sample
        with:
          command: check
      # check prefers PyYAML, which an image may have on its Python, and doesn't log
      # which one read a file. With an import of PyYAML that fails, only yq can read
      # the set-up: a check that passes here ran the yq of this image for real.
      - name: Check the sample's set-up through the action, with yq in place of PyYAML
        id: sample-check-yq
        if: ${{ !cancelled() && steps.sample-install.outcome == 'success' }}
        uses: ./
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/sample
          PYTHONPATH: ${{ runner.temp }}/no-pyyaml
        with:
          command: check
      # This repository's workflows and firewall policy are the blueprint's copies of
      # the templates of the release that it pins, which the check issue-assistant of
      # the Lint workflow compares with them. Here the check of this commit sees the
      # set-up as the blueprint brings it with the next release: with the templates
      # of this commit, so that a change of a template never fails this check.
      - name: Install the templates of this commit into a copy of this repository
        id: own-install
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/own
        run: |
          cp -r . "$ISSUE_ASSISTANT_ROOT"
          rm "$ISSUE_ASSISTANT_ROOT/.github/egress-firewall.yaml"
          python3 -m issue_assistant install --ref "$GITHUB_SHA" --version smoke-test
      - name: Check this repository's set-up through the action
        id: own-check
        if: ${{ !cancelled() && steps.own-install.outcome == 'success' }}
        uses: ./
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/own
        with:
          command: check
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml: each
      # part of the job that failed, or the job itself when none of them did; a leg
      # on another runner also says what to look at there.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: ${{ matrix.check }}
          FAILED: |
            ${{ steps.template-lint.outcome == 'failure' && 'template-lint' || '' }}
            ${{ steps.template-security.outcome == 'failure' && 'template-security' || '' }}
            ${{ (steps.sample-install.outcome == 'failure' || steps.sample-check.outcome == 'failure' || steps.sample-check-yq.outcome == 'failure') && 'sample-setup' || '' }}
            ${{ (steps.own-install.outcome == 'failure' || steps.own-check.outcome == 'failure') && 'own-setup' || '' }}
            ${{ matrix.runner != 'ubuntu-24.04' && 'other-runner' || '' }}
        run: |
          mapfile -t parts < <(grep . <<<"$FAILED" || true)
          python3 .github/blueprint.py coach explain "$CHECK" --parts "${parts[@]}"

  # The action of this commit against GitHub itself, behind the egress block of the
  # templates, with a token that can only read: dry runs of the commands that read
  # the most of GitHub, and the context of a real issue. So a request that GitHub
  # refuses, or a host that the action or the GitHub CLI starts to need, fails here,
  # before a release brings it to every repository.
  egress:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: read
      issues: read
      pull-requests: read
    strategy:
      # Every leg reports, so that a failure shows on the runners where it happens.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check: action behind the egress block
          - runner: ubuntu-26.04
            check: action behind the egress block (ubuntu-26.04)
          - runner: ubuntu-24.04-arm
            check: action behind the egress block (ubuntu-24.04-arm)
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Remind and close, as a dry run
        id: sweep
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./
        with:
          command: sweep
          dry-run: true
      - name: Create and update the labels, as a dry run
        id: sync-labels
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./
        with:
          command: sync-labels
          dry-run: true
      # This repository has few issues and no discussions. A closed issue with
      # comments of a public repository that uses the action, among its other issues
      # and discussions, reads all that context reads, the GraphQL query of the
      # discussions too: an error of it fails context, and an empty answer fails the
      # check of discussions.jsonl.
      - name: Write the context of a real issue
        id: context
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Dennis-Otto/homedarts-for-autodarts
          GH_TELEMETRY: "false"
        run: |
          python3 -m issue_assistant context --issue 105 --mode triage
          for file in issue.md labels.md issues.jsonl discussions.jsonl corrections.md rules.md prompt.md schema.json; do
            if [[ ! -s ".issue-assistant/$file" ]]; then
              echo "::error::context wrote no .issue-assistant/$file"
              exit 1
            fi
          done
          # Reading the corrections only warns when GitHub fails; here it fails.
          if grep -q 'GitHub failed' .issue-assistant/corrections.md; then
            echo "::error::reading the corrections failed against the real API"
            exit 1
          fi
          wc -l .issue-assistant/*.jsonl
      # The PR coach, as in the job action.
      - name: Explain the failure
        if: failure() && steps.blocks.outcome != 'failure'
        env:
          CHECK: ${{ matrix.check }}
          FAILED: |
            ${{ (steps.sweep.outcome == 'failure' || steps.sync-labels.outcome == 'failure') && 'egress-dry-runs' || '' }}
            ${{ steps.context.outcome == 'failure' && 'egress-context' || '' }}
            ${{ matrix.runner != 'ubuntu-24.04' && 'other-runner' || '' }}
        run: |
          mapfile -t parts < <(grep . <<<"$FAILED" || true)
          python3 .github/blueprint.py coach explain "$CHECK" --parts "${parts[@]}"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  # The action on a Python that is too old, as on ubuntu-22.04, on a self-hosted runner
  # or after setup-python: it must stop in its first step, with a message that names
  # the version and the fix. The log of a step can't be read in its own job, so the
  # step after it runs that first step once more, as action.yml has it, and reads what
  # it writes. The annotation of the error that this job shows, while it passes, is the
  # one that it waits for.
  old-python:
    name: the action on a Python that is too old
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run the action, which must refuse this Python
        id: refused
        continue-on-error: true
        uses: ./
        with:
          command: check
      - name: Make sure that it refused it with its message and no traceback
        env:
          OUTCOME: ${{ steps.refused.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::The action ran on Python 3.11, where it must stop with its message."
            exit 1
          fi
          yq '.runs.steps[] | select(.id == "python") | .run' action.yml > "$RUNNER_TEMP/guard.sh"
          if bash -e "$RUNNER_TEMP/guard.sh" > "$RUNNER_TEMP/guard.log" 2>&1; then
            echo "::error::The check of the Python in action.yml let $(python3 --version) through."
            exit 1
          fi
          # With a mark before each line, so that the runner takes no line for a command.
          sed 's/^/> /' "$RUNNER_TEMP/guard.log"
          if ! grep --quiet '^::error::.*Python 3\.11\.' "$RUNNER_TEMP/guard.log"; then
            echo "::error::The message of the check of the Python in action.yml doesn't name Python 3.11."
            exit 1
          fi
          if grep --quiet 'Traceback' "$RUNNER_TEMP/guard.log"; then
            echo "::error::The check of the Python in action.yml wrote a traceback."
            exit 1
          fi
      # On the Python of the runner, which blueprint.py supports; this job's isn't.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: the action on a Python that is too old
        run: /usr/bin/python3 .github/blueprint.py coach explain "$CHECK"

  # The AI's runner in reserve, decision 0019: with ISSUE_ASSISTANT_AI_RUNNER set to
  # ubuntu-24.04, the job event names the hosts of .github/egress-firewall.yaml for
  # Harden-Runner, and analyze-in-reserve, in place of analyze, blocks every other
  # host. These two jobs run that block as analyze-in-reserve does, so that a host of
  # the policy that the block refuses, or one outside it that gets through, fails
  # here before a repository needs it.
  fallback-hosts:
    name: the hosts for the AI's runner in reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      endpoints: ${{ steps.endpoints.outputs.endpoints }}
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the hosts of the firewall policy for the AI's runner
        id: endpoints
        uses: ./
        env:
          ISSUE_ASSISTANT_AI_RUNNER: ubuntu-24.04
        with:
          command: endpoints
      - name: Explain the failure
        if: failure() && steps.blocks.outcome != 'failure'
        env:
          CHECK: the hosts for the AI's runner in reserve
        run: python3 .github/blueprint.py coach explain "$CHECK"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  fallback:
    name: the AI's runner in reserve behind Harden-Runner
    needs: fallback-hosts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # As the first step of analyze-in-reserve, on the runner of
      # ISSUE_ASSISTANT_AI_RUNNER.
      - name: Block every host but those of the firewall policy
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: ${{ needs.fallback-hosts.outputs.endpoints }}
      # As the second step of analyze-in-reserve.
      - name: Let Harden-Runner see the DNS lookups
        run: |
          dropins=(/etc/systemd/resolved.conf.d/90-egress-proxy.conf /run/systemd/resolved.conf.d/90-egress-proxy.conf)
          if [[ ! -e ${dropins[0]} && ! -e ${dropins[1]} ]] && ! grep -qs 127.0.0.100 /etc/resolv.conf; then
            exit 0
          fi
          echo "::notice::GitHub's DNS experiment is on this runner; taking it out of the way of Harden-Runner."
          sudo rm -f "${dropins[@]}"
          sudo systemctl restart systemd-resolved
          sudo ln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          sudo systemctl stop egress-dns-resolver.service egress-outbound-proxy.service || true
          sudo resolvectl flush-caches || true
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Make sure that the network block holds
        run: |
          # A request to example.com, a host of no firewall policy, has to fail: two in a
          # row, five seconds apart, so that a hiccup of example.com isn't taken for the
          # block, within a minute, since Harden-Runner lets the job go on while its agent
          # still starts. Then a request to api.github.com, a host of every policy, has to
          # get an answer, so that a network that reaches no host isn't taken for it.
          failures=0
          attempt=0
          while [ "$failures" -lt 2 ]; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 12 ]; then
              echo "::error::A request to example.com, a host outside .github/egress-firewall.yaml, got through, so the AI doesn't run: nothing blocks the hosts that the policy leaves out. On ubuntu-24.04-firewall, GitHub didn't enforce the policy: the job lacks the permission contents: read, the policy says mode: log in place of mode: enforce, or GitHub changed its preview of the egress firewall. Behind Harden-Runner, on the runner of ISSUE_ASSISTANT_AI_RUNNER, it blocks in a private repository only with a subscription of StepSecurity, and when its log says Reverted changes, its agent gave up at its start: run the job again. Until the block holds, set ISSUE_ASSISTANT_AI to off: https://dennis-otto.github.io/issue-assistant/troubleshooting/"
              exit 1
            fi
            if curl --silent --max-time 10 --output /dev/null https://example.com; then
              failures=0
            else
              failures=$((failures + 1))
            fi
            [ "$failures" -ge 2 ] || sleep 5
          done
          attempt=1
          until curl --silent --max-time 10 --output /dev/null https://api.github.com/; do
            if [ "$attempt" -ge 12 ]; then
              echo "::error::No request to api.github.com, a host of every firewall policy, got an answer within a minute, so the failed requests to example.com prove no block, and the AI doesn't run: the runner reaches no host. Run the job again."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "The network blocks example.com, a host outside .github/egress-firewall.yaml, and lets api.github.com through."
      - name: Wait until Harden-Runner lets the hosts through
        # Only the hosts that the next steps need first, and that the runner may have
        # asked for past Harden-Runner, which then blocks such an address for as long as
        # systemd-resolved keeps it, up to a minute. The policy also names hosts of the
        # engines that this repository may not use, and a mirror that answers only on
        # port 80; waiting for those would hold up the AI for two minutes.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - name: Make sure that the block lets the hosts of the policy through
        run: |
          # A host of the engines on 443, and the mirror of Ubuntu on 80, from which
          # the Claude Code action installs bubblewrap.
          for url in https://registry.npmjs.org/ http://azure.archive.ubuntu.com/ubuntu/; do
            if ! curl --silent --show-error --fail --max-time 20 --output /dev/null "$url"; then
              echo "::error::Harden-Runner blocked $url, a host of .github/egress-firewall.yaml."
              exit 1
            fi
            echo "Harden-Runner lets $url through."
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure() && steps.blocks.outcome == 'success'
        with:
          persist-credentials: false
      - name: Explain the failure
        if: failure() && steps.blocks.outcome == 'success'
        env:
          CHECK: the AI's runner in reserve behind Harden-Runner
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # The network block of the AI, decision 0025: the step that makes sure of it, as the
  # jobs analyze and analyze-in-reserve of both reusable workflows and the job replay
  # of the Evaluate workflow run it, here on GitHub's egress-firewall runner with this
  # repository's .github/egress-firewall.yaml, where it has to pass, and on a runner
  # without any block, where it has to stop the AI. The firewall is a technical
  # preview whose rules and discovery of the policy may change, so each run also
  # records in its summary how the firewall refused example.com, and a change shows
  # here, in every pull request and every week, before an analysis of a repository
  # meets it.
  firewall:
    name: the network block of the AI's runner
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 5
    # The firewall enforces the policy of the repository only for a job that may read
    # its contents.
    permissions:
      contents: read
    steps:
      - name: Make sure that the network block holds
        run: |
          # A request to example.com, a host of no firewall policy, has to fail: two in a
          # row, five seconds apart, so that a hiccup of example.com isn't taken for the
          # block, within a minute, since Harden-Runner lets the job go on while its agent
          # still starts. Then a request to api.github.com, a host of every policy, has to
          # get an answer, so that a network that reaches no host isn't taken for it.
          failures=0
          attempt=0
          while [ "$failures" -lt 2 ]; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 12 ]; then
              echo "::error::A request to example.com, a host outside .github/egress-firewall.yaml, got through, so the AI doesn't run: nothing blocks the hosts that the policy leaves out. On ubuntu-24.04-firewall, GitHub didn't enforce the policy: the job lacks the permission contents: read, the policy says mode: log in place of mode: enforce, or GitHub changed its preview of the egress firewall. Behind Harden-Runner, on the runner of ISSUE_ASSISTANT_AI_RUNNER, it blocks in a private repository only with a subscription of StepSecurity, and when its log says Reverted changes, its agent gave up at its start: run the job again. Until the block holds, set ISSUE_ASSISTANT_AI to off: https://dennis-otto.github.io/issue-assistant/troubleshooting/"
              exit 1
            fi
            if curl --silent --max-time 10 --output /dev/null https://example.com; then
              failures=0
            else
              failures=$((failures + 1))
            fi
            [ "$failures" -ge 2 ] || sleep 5
          done
          attempt=1
          until curl --silent --max-time 10 --output /dev/null https://api.github.com/; do
            if [ "$attempt" -ge 12 ]; then
              echo "::error::No request to api.github.com, a host of every firewall policy, got an answer within a minute, so the failed requests to example.com prove no block, and the AI doesn't run: the runner reaches no host. Run the job again."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "The network blocks example.com, a host outside .github/egress-firewall.yaml, and lets api.github.com through."
      - name: Record how the firewall refuses a host outside the policy
        if: ${{ !cancelled() }}
        run: |
          # For the summary of the job: the exit code of curl, such as 6 when the name
          # doesn't resolve, 7 when no connection comes, 28 at the time limit, 35 or 56
          # when the connection breaks off and 22 for an answer with an HTTP error, and
          # the address that the name resolves to.
          {
            echo "### How the firewall refused example.com"
            echo
            echo "| Request | Exit code of curl | HTTP status and error |"
            echo "| --- | --- | --- |"
            for url in https://example.com/ http://example.com/; do
              code=0
              status=$(curl --fail --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" 2> "$RUNNER_TEMP/error") || code=$?
              echo "| \`$url\` | $code | $status $(tr '\n' ' ' < "$RUNNER_TEMP/error") |"
            done
            # A block of names alone would pass the probe: a request to a fixed
            # address outside the policy shows whether connections are refused too.
            code=0
            status=$(curl --fail --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' https://1.1.1.1/ 2> "$RUNNER_TEMP/error") || code=$?
            echo "| \`https://1.1.1.1/\`, an address without a name | $code | $status $(tr '\n' ' ' < "$RUNNER_TEMP/error") |"
            address=$(getent hosts example.com | tr '\n' ' ') || address=none
            echo
            echo "The address of example.com: ${address:-none}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure()
        with:
          persist-credentials: false
      - name: Explain the failure
        if: failure()
        env:
          CHECK: the network block of the AI's runner
        run: python3 .github/blueprint.py coach explain "$CHECK"

  no-block:
    name: the probe of the network block on a runner without one
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure that the probe stops the AI where nothing blocks
        run: |
          # The step of analyze itself, from the reusable workflow, on a runner where
          # example.com answers: it has to fail with its message. With a mark before
          # each line of its output, so that the runner takes no line for a command.
          yq '.jobs.analyze.steps[] | select(.name == "Make sure that the network block holds") | .run' \
            .github/workflows/reusable-issue-assistant.yml > "$RUNNER_TEMP/probe.sh"
          code=0
          bash -e "$RUNNER_TEMP/probe.sh" > "$RUNNER_TEMP/probe.log" 2>&1 || code=$?
          sed 's/^/> /' "$RUNNER_TEMP/probe.log"
          if [ "$code" -eq 0 ]; then
            echo "::error::The step that makes sure that the network block holds passed on ubuntu-24.04, where nothing blocks example.com, so it would let the AI run without a block."
            exit 1
          fi
          if ! grep --quiet '^::error::A request to example\.com, a host outside \.github/egress-firewall\.yaml, got through' "$RUNNER_TEMP/probe.log"; then
            echo "::error::The step that makes sure that the network block holds failed on ubuntu-24.04, but not with its message that example.com got through."
            exit 1
          fi
          echo "The step stops the AI where nothing blocks example.com."
      - name: Explain the failure
        if: failure()
        env:
          CHECK: the probe of the network block on a runner without one
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # The names that keep each engine to reading belong to its vendor: the inputs and
  # outputs of its action, the flags of its command line and the keys of its
  # settings. GitHub only warns about an input that an action lacks, and the command
  # lines ignore a key that they don't know, so a release that renames one keeps the
  # step running without its boundary. No check of a pull request runs an engine, so
  # this job checks the names against the pinned versions, without a secret, behind
  # a block that lets through GitHub, npm's registry and Sigstore's root of trust
  # alone: on a pull request that changes the step of an engine, a lock file of
  # engines/ or what the check reads, such as an update of Renovate, every week and
  # by hand. npm verifies the attestations of the packages of the lock files with
  # Sigstore's root, which the job analyze never reads (decision 0017).
  engines:
    name: engine contracts
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Block every host but GitHub's, npm's and Sigstore's root of trust
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443
      # GitHub's DNS experiment on some of its runners hides the lookups of the job from
      # Harden-Runner, which then blocks its hosts until the time limit
      # (step-security/harden-runner#708). Harden-Runner takes it away unless its
      # feature flags say no; a job that keeps sudo makes sure, as analyze-in-reserve
      # does.
      - name: Let Harden-Runner see the DNS lookups
        run: |
          dropins=(/etc/systemd/resolved.conf.d/90-egress-proxy.conf /run/systemd/resolved.conf.d/90-egress-proxy.conf)
          if [[ ! -e ${dropins[0]} && ! -e ${dropins[1]} ]] && ! grep -qs 127.0.0.100 /etc/resolv.conf; then
            exit 0
          fi
          echo "::notice::GitHub's DNS experiment is on this runner; taking it out of the way of Harden-Runner."
          sudo rm -f "${dropins[@]}"
          sudo systemctl restart systemd-resolved
          sudo ln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          sudo systemctl stop egress-dns-resolver.service egress-outbound-proxy.service || true
          sudo resolvectl flush-caches || true
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # Only on a pull request: whether it changes a file that the check reads.
      - name: Look for a change of an engine
        id: changes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/engine_contract.py changes
      - name: Check the inputs and outputs of the engines' actions
        id: actions
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changes.outputs.engines != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/engine_contract.py actions
      # Installs each command line as analyze does, verifies the signatures of the
      # lock files and runs it without a key; the token only reads the schema of the
      # settings, and no command line sees it.
      - name: Check the flags and settings of the engines' command lines
        id: clis
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changes.outputs.engines != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/engine_contract.py clis
      # A step before the checkout failed after the one that makes sure that
      # Harden-Runner blocks: the PR coach needs the checkout for its explanation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure() && steps.checkout.outcome != 'success' && steps.blocks.outcome == 'success'
        with:
          persist-credentials: false
      # The PR coach, as in the job action.
      - name: Explain the failure
        if: failure() && steps.blocks.outcome == 'success'
        env:
          CHECK: engine contracts
          FAILED: |
            ${{ steps.changes.outcome == 'failure' && 'engine-changes' || '' }}
            ${{ steps.actions.outcome == 'failure' && 'engine-actions' || '' }}
            ${{ steps.clis.outcome == 'failure' && 'engine-clis' || '' }}
        run: |
          mapfile -t parts < <(grep . <<<"$FAILED" || true)
          python3 .github/blueprint.py coach explain "$CHECK" --parts "${parts[@]}"

  # GitHub changes its API without a release of the action. The tests check the
  # GraphQL documents and the REST requests of the script against the copies of
  # GitHub's schema and description in tests/github/; here, every week, they meet what
  # GitHub publishes that day. Copies that still pass go to the next job.
  schema:
    name: GraphQL and REST against GitHub's current schemas
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Download GitHub's schema and description of today
        id: download
        run: python scripts/github_schemas.py download "$RUNNER_TEMP/github"
      - name: Check the requests against them
        env:
          GRAPHQL_SCHEMA: ${{ runner.temp }}/github/schema.docs.graphql
          REST_DESCRIPTION: ${{ runner.temp }}/github/api.github.com.json
        run: python -m pytest -p no:cacheprovider tests/test_graphql_contract.py tests/test_rest_contract.py
      # Also when a request fails: the changes show what GitHub changed.
      - name: Compare them with the copies in tests/github/
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        run: |
          for file in schema.docs.graphql api.github.com.json; do
            if cmp --silent "$RUNNER_TEMP/github/$file" "tests/github/$file"; then
              echo "The copy of \`$file\` in tests/github/ is current." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "::notice::GitHub has changed $file since the copy in tests/github/."
            {
              echo "GitHub has changed \`$file\` since the copy in tests/github/:"
              echo
              echo '```'
              diff --unified=0 "tests/github/$file" "$RUNNER_TEMP/github/$file" | grep -E '^[-+][^-+]' | head -n 40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep them for the pull request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-schemas
          path: ${{ runner.temp }}/github/
          if-no-files-found: error
          retention-days: 1
      # The PR coach, as in the job action; this job has no parts.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: GraphQL and REST against GitHub's current schemas
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # The copies of the job before, which passed the contract tests, in the one pull
  # request from bot/github-schemas: the release app's, since a pull request of the
  # job's token starts no check. It merges itself once its checks pass, and closes
  # when main already has these copies, which is why the job also runs without a change.
  schema-refresh:
    name: the copies of GitHub's schemas in a pull request
    needs: schema
    if: github.ref_name == github.event.repository.default_branch
    concurrency:
      group: ${{ github.workflow }}-schema-refresh
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    env:
      # The GitHub CLI's telemetry would only knock at a blocked host.
      GH_TELEMETRY: "false"
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the copies of the job before
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-schemas
          path: ${{ runner.temp }}/github
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the job schema of the Action test
          TASK: open the pull request with the copies of GitHub's schemas
          WITHOUT: the summary of the job before shows what GitHub changed
          REQUIRED: "false"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py checklist\` shows the steps: a link that registers the app with its permissions filled in, the update of the answers of the blueprint that names it in \`.github/repository.toml\`, the settings and its private key. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # What the branch, the pull request and its merge need. Workflows because the
          # branch of an open pull request moves from a commit on an older main to one
          # on the newest, and GitHub refuses that move without workflows when main
          # changed a workflow in between. The commit itself holds only the two copies.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open, update or close the one pull request
        id: refresh
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/github_schemas.py refresh "$RUNNER_TEMP/github"
      - name: Let the pull request merge itself
        if: steps.refresh.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.refresh.outputs.number }}
        # GitHub refuses auto-merge once every check has passed: then it merges at once.
        run: gh pr merge --auto --squash "$NUMBER" || gh pr merge --squash "$NUMBER"
      - name: Explain the failure
        if: failure() && steps.blocks.outcome != 'failure'
        env:
          CHECK: the copies of GitHub's schemas in a pull request
        run: python3 .github/blueprint.py coach explain "$CHECK"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
