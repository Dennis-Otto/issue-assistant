name: Issue lifecycle

# The job of templates/.github/workflows/issue-lifecycle.yml, which every repository
# that uses the issue assistant calls at the commit of a release. Without AI: reminds
# reporters who were asked for information, closes their issue without an answer,
# closes a possible duplicate unless someone objected, labels the issues that a
# merged pull request fixes, and closes them with a link once a release ships the
# fix. The job blocks every host but GitHub's with Harden-Runner and runs the issue
# assistant of this workflow's own commit (decision 0015).
# https://github.com/Dennis-Otto/issue-assistant

on:
  workflow_call:
    inputs:
      dry_run:
        description: Only show what would happen
        type: boolean
        default: false

permissions: {}

jobs:
  sweep:
    name: Remind and close
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.merged &&
         github.event.pull_request.user.login != 'dependabot[bot]')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event != 'schedule'))
    # The job waits for the group, not the run: a run whose job is skipped never
    # takes the place of a sweep that waits.
    # A dry run writes nothing, so it waits for no other run, and none waits for
    # it or is replaced by it, such as by the dry runs of the Workflow test of
    # the issue assistant's pull requests.
    concurrency:
      group: ${{ inputs.dry_run && format('issue-lifecycle-dry-run-{0}', github.run_id) || 'issue-lifecycle' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      # The default branch, also for a merged pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit of this workflow, which the caller pins. actionlint 1.7.12 doesn't
      # know job.workflow_repository and job.workflow_sha yet, which toJSON hides,
      # nor the self-repository syntax $/, which would need no checkout.
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant.py
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Remind, close and mark fixed issues
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: sweep
          dry-run: ${{ inputs.dry_run }}
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
