name: Newest Python

# The checks of scripts/check.sh with the newest Python, beta included, which warns
# early of what the next Python of the runners breaks: after every change of main and
# every week. Not in pull requests: a new Python breaks main and every pull request
# alike, and no pull request waits for this check. A workflow of its own, so that its
# warning leaves the CI of main green, whose coverage the report of the PR coach
# compares every pull request with. Since no pull request shows the warning, a failure keeps one issue
# open, which the weekly run closes once the checks pass again.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit of main makes the run for an older one moot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  newest-python:
    name: check (newest Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          allow-prereleases: true
      - name: Install the hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the checks
        run: bash scripts/check.sh

  # The issue of the warning: a failed run on main opens it or brings it up to date,
  # and the weekly run closes it once the checks pass with the newest Python again.
  report:
    name: report
    needs: newest-python
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.newest-python.result == 'failure' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Keep the issue of the newest Python current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.newest-python.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The checks fail with the newest Python"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "The checks pass with the newest Python again."
            fi
            exit 0
          fi
          body="$(printf '%s\n\n%s\n' \
            "The checks of scripts/check.sh fail with the newest Python, beta included, which the runners get next. Make them pass with it; the weekly run closes this issue then." \
            "The latest failure: $URL")"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label maintenance --body "$body"
          fi
