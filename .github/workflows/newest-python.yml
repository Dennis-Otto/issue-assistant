name: Newest Python

# The checks of scripts/check.sh with the newest release of Python, which warns early
# of what the next Python of the runners breaks: after every change of main and every
# week. check-latest takes it from actions/python-versions as soon as it is out, not
# the older Python that the image of the runner keeps in its cache. Not in pull
# requests: a new Python breaks main and every pull request alike, and no pull request
# waits for this check. A workflow of its own, so that its warning leaves the CI of
# main green, whose coverage the report of the PR coach compares every pull request
# with. Since no pull request shows the warning, a failure keeps one issue open, which
# names the Python that failed and which the weekly run closes once the checks pass
# again.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit of main makes the run for an older one moot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  newest-python:
    name: check (newest Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The version of Python that the run checked, for the issue of the warning.
    outputs:
      version: ${{ steps.python.outputs.python-version }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.x"
          check-latest: true
      - name: Name the Python of the run
        run: echo "The checks run with $(python --version), the newest release of Python." >> "$GITHUB_STEP_SUMMARY"
      - name: Install the hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the checks
        run: bash scripts/check.sh

  # The issue of the warning: a failed run on main opens it or brings it up to date,
  # and the weekly run closes it once the checks pass with the newest Python again.
  report:
    name: report
    needs: newest-python
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.newest-python.result == 'failure' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - name: Keep the issue of the newest Python current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.newest-python.result }}
          VERSION: ${{ needs.newest-python.outputs.version }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The checks fail with the newest Python"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "The checks pass with the newest Python again."
            fi
            exit 0
          fi
          # The version that the run checked; none when setting up Python failed.
          python="the newest Python"
          if [[ -n "$VERSION" ]]; then
            python="Python $VERSION, the newest release"
          fi
          body="$(printf '%s\n\n%s\n' \
            "The checks of scripts/check.sh fail with $python, which the runners get next. Make them pass with it; the weekly run closes this issue then." \
            "The latest failure: $URL")"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label maintenance --body "$body"
          fi
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
