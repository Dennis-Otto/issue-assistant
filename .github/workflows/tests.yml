name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the Python of GitHub's Ubuntu 24.04 runners, which run the action.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the tests with a coverage gate
        run: |
          coverage run -m pytest -q
          coverage report
          { echo '### Coverage'; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - run: ruff check .
      - run: ruff format --check .
      - name: Check strict typing
        run: mypy

  action:
    name: action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action runs on the runner's own Python, without PyYAML: check falls back
      # to yq, as it does in every repository that uses the action.
      - name: Install the action into the sample repository
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/sample
        run: |
          cp -r tests/sample "$ISSUE_ASSISTANT_ROOT"
          python3 issue_assistant.py install --ref "$GITHUB_SHA" --version smoke-test
      - name: Check the sample's set-up through the action
        uses: ./
        env:
          ISSUE_ASSISTANT_ROOT: ${{ runner.temp }}/sample
        with:
          command: check

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the workflows and the templates
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color .github/workflows/*.yml templates/.github/workflows/*.yml
