name: Fuzzing

# Coverage-guided fuzzing with Atheris of every target in fuzz/: a minute each in
# every pull request that changes the code, the targets or the tools, and every week
# 25 minutes shared by all targets, so the job ends within its timeout however many
# targets there are. Not after a merge, which gives main the tree that its pull
# request fuzzed. A finding fails the run, with the input that caused it in the log.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request:
    paths:
      - "**/*.py"
      - fuzz/**
      - "**/requirements*.txt"
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz
    # Not in the release pull request: the branch of the release bot in this repository.
    if: >-
      !startsWith(github.head_ref, 'release-please--') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          # Atheris supports Python 3.12.
          python-version: "3.12"
      # uv installs the hash-pinned tools in seconds and checks the hash of each
      # package. Its cache keeps only the wheels that it built from source, under a
      # key of the lock file: pre-built ones download faster than a cache restores
      # them.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.0"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: requirements-fuzz.txt
      - name: Install the hash-pinned Atheris
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r requirements-fuzz.txt
      - name: Fuzz every target
        env:
          # The weekly budget is shared by every target, a pull request gives each one
          # a minute: the job's timeout of 30 minutes covers the setup as well.
          WEEKLY_SECONDS: ${{ github.event_name == 'schedule' && '1500' || '' }}
        run: |
          shopt -s nullglob
          targets=(fuzz/fuzz_*.py)
          SECONDS_TO_FUZZ=60
          if [ -n "$WEEKLY_SECONDS" ] && [ "${#targets[@]}" -gt 0 ]; then
            SECONDS_TO_FUZZ=$(( WEEKLY_SECONDS / ${#targets[@]} ))
          fi
          for target in "${targets[@]}"; do
            echo "::group::$target"
            corpus="$RUNNER_TEMP/corpus/$(basename "$target" .py)"
            mkdir -p "$corpus"
            python "$target" "$corpus" -max_total_time="$SECONDS_TO_FUZZ" \
              -rss_limit_mb=2048 -artifact_prefix="$RUNNER_TEMP/"
            echo "::endgroup::"
          done
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: fuzz
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
