name: Release

# The release bot. release-please keeps a pull request for the next release: the
# version and the changelog from the Conventional Commit titles merged since the
# last release. Merging it creates the release as a draft, with its tag. The jobs
# below attach the package, its SBOM and its signed provenance, make the release
# public, and then deliver it where the repository variable PUBLISH_TO says:
# pypi, npm, ghcr, hacs, nextcloud-appstore, github-action or none. A release that
# only updates dependencies merges itself once its checks pass.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  # Merges that auto-merge does with the token of a workflow, such as those of
  # Dependabot's updates, start no workflow; so the release bot looks every hour too.
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release pull request
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - name: Create a token of the release app
        id: app
        if: vars.RELEASE_AUTOMATION_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the release pull request and its merge need.
          permission-contents: write
          permission-pull-requests: write
      - name: Update the release pull request, or create the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request of the release app starts the checks; one of the job's
          # GITHUB_TOKEN would start none.
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge a release of dependency updates once its checks pass
        if: steps.release.outputs.pr != '' && steps.app.outputs.token != ''
        env:
          # Merged by the app, the release starts this workflow again and is created.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number="$(jq -r .number <<<"$PR")"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -z "$latest" ]]; then
            echo "The first release waits for the maintainer."
            exit 0
          fi
          subjects="$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" \
            --jq '.commits[].commit.message | split("\n")[0]')"
          others="$(grep -Ev '^(fix|chore|build)\(deps(-dev)?\): ' <<<"$subjects" || true)"
          if [[ -n "$others" ]]; then
            echo "The release holds more than dependency updates; the maintainer merges it:"
            echo "$others"
            exit 0
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$number"

  assets:
    name: release assets
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing key of a Nextcloud app belongs to this environment.
    environment:
      name: release
      deployment: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      PUBLISH_TO: ${{ vars.PUBLISH_TO }}
      KRANKERL_VERSION: 0.14.0
      KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f
      NEXTCLOUD_VERSION: 33.0.8
      NEXTCLOUD_SHA256: d974bcbe446edaf87ae17113200b362495abbdb89d7900d65d930fe7a9dc9474
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Collect the assets in one folder
        run: |
          echo "ASSETS=$RUNNER_TEMP/assets" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/assets"

      - name: Package the integration for HACS
        if: env.PUBLISH_TO == 'hacs'
        run: |
          # The archive holds the integration folder's content, as HACS zip releases do.
          domain="$(basename custom_components/*/)"
          filename="$(jq -r '.filename // empty' hacs.json)"
          git archive --format=zip --output="$ASSETS/${filename:-$domain.zip}" "HEAD:custom_components/$domain"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.PUBLISH_TO == 'pypi'
        with:
          python-version-file: .python-version
      - name: Build the Python package
        if: env.PUBLISH_TO == 'pypi'
        run: |
          # The build backend comes hash-pinned from requirements-dev.txt as well.
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m build --no-isolation --outdir "$ASSETS"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.PUBLISH_TO == 'npm'
        with:
          node-version-file: .nvmrc
      - name: Pack the npm package
        if: env.PUBLISH_TO == 'npm'
        run: |
          npm ci --ignore-scripts
          npm run build --if-present
          npm pack --pack-destination "$ASSETS"

      - name: Set up PHP for the signing of the Nextcloud app
        if: env.PUBLISH_TO == 'nextcloud-appstore'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
          extensions: dom, libxml, mbstring, xml, zip
          coverage: none
      - name: Build and sign the Nextcloud app
        if: env.PUBLISH_TO == 'nextcloud-appstore'
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::The secret APP_PRIVATE_KEY of the environment release is missing."
            exit 1
          fi
          app_id="$(python3 -c 'import xml.etree.ElementTree as t; print(t.parse("appinfo/info.xml").getroot().findtext("id"))')"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/krankerl.deb" \
            "https://github.com/ChristophWurst/krankerl/releases/download/v$KRANKERL_VERSION/krankerl_${KRANKERL_VERSION}_amd64.deb"
          echo "$KRANKERL_SHA256  $RUNNER_TEMP/krankerl.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/krankerl.deb"
          krankerl package
          umask 077
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/app.key"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/app.crt" \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/$app_id/$app_id.crt"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/nextcloud.zip" \
            "https://download.nextcloud.com/server/releases/nextcloud-$NEXTCLOUD_VERSION.zip"
          echo "$NEXTCLOUD_SHA256  $RUNNER_TEMP/nextcloud.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/nextcloud.zip" -d "$RUNNER_TEMP/server"
          mkdir -p "$RUNNER_TEMP/signing"
          tar --extract --gzip --file "build/artifacts/$app_id.tar.gz" --directory "$RUNNER_TEMP/signing"
          php "$RUNNER_TEMP/server/nextcloud/occ" integrity:sign-app \
            --privateKey="$RUNNER_TEMP/app.key" --certificate="$RUNNER_TEMP/app.crt" \
            --path="$RUNNER_TEMP/signing/$app_id"
          test -s "$RUNNER_TEMP/signing/$app_id/appinfo/signature.json"
          tar --create --gzip --file "$ASSETS/$app_id.tar.gz" --directory "$RUNNER_TEMP/signing" "$app_id"
          openssl dgst -sha512 -sign "$RUNNER_TEMP/app.key" -out "$ASSETS/$app_id.tar.gz.sig" "$ASSETS/$app_id.tar.gz"
          openssl x509 -in "$RUNNER_TEMP/app.crt" -pubkey -noout > "$RUNNER_TEMP/app.pub"
          openssl dgst -sha512 -verify "$RUNNER_TEMP/app.pub" -signature "$ASSETS/$app_id.tar.gz.sig" "$ASSETS/$app_id.tar.gz"
          rm -f "$RUNNER_TEMP/app.key"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/${{ github.event.repository.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.52.0

      - name: Attest the provenance of every asset
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Attach the assets and their signed provenance to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "$ASSETS/provenance.sigstore.json"
          gh release upload "$TAG" "$ASSETS"/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: publish the release
    needs: [release-please, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Make the complete release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  pypi:
    name: deliver to PyPI
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI accepts this workflow and environment, no token.
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the packages of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    name: deliver to npm
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing with provenance: npm accepts this workflow, no token.
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ github.event.repository.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the package of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz'
          npm publish ./*.tgz --provenance --access public

  ghcr:
    name: deliver to GHCR
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'ghcr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image in the lowercase that registries require
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
      - name: Build and push the image with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  nextcloud-appstore:
    name: deliver to the Nextcloud App Store
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'nextcloud-appstore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Submit the signed package of the public release
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$APPSTORE_TOKEN" ]]; then
            echo "::error::The secret APPSTORE_TOKEN of the environment release is missing."
            exit 1
          fi
          app_id="$(python3 -c 'import xml.etree.ElementTree as t; print(t.parse("appinfo/info.xml").getroot().findtext("id"))')"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$app_id.tar.gz.sig"
          umask 077
          jq --null-input \
            --arg download "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$app_id.tar.gz" \
            --arg signature "$(openssl base64 -A -in "$app_id.tar.gz.sig")" \
            '{download: $download, signature: $signature, nightly: false}' > "$RUNNER_TEMP/request.json"
          # The API creates or updates the same version; a retry creates no second release.
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 180 --request POST \
            --header "Authorization: Token $APPSTORE_TOKEN" --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/request.json" https://apps.nextcloud.com/api/v1/apps/releases

  github-action:
    name: move the major tag
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'github-action'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Point the major tag at the release, as users of v1 and the like expect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "$TAG" "$TAG^{commit}"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$MAJOR"
