name: Property tests

# The property tests with new random inputs every night, beyond the fixed inputs of
# the CI. A failure shows its seed in the summary; run the workflow by hand with that
# seed to replay it. https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "57 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: The seed to replay; empty for a random one
        required: false

permissions:
  contents: read

jobs:
  properties:
    name: properties
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs the hash-pinned tools in seconds and checks the hash of each
      # package. Its cache keeps only the wheels that it built from source, under a
      # key of the lock file: pre-built ones download faster than a cache restores
      # them.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.4"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-test.txt
      - name: Install the hash-pinned tools
        timeout-minutes: 5
        run: |
          requirements="requirements-dev.txt"
          if [[ -f requirements-test.txt ]]; then
            requirements="requirements-test.txt"
          fi
          uv pip install --system --require-hashes -r "$requirements"
      - name: Run the property tests with random inputs
        env:
          SEED: ${{ inputs.seed }}
        run: |
          seed="${SEED:-$RANDOM$RANDOM}"
          echo "Seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
          options=()
          if python -c "import pytest_timeout" 2>/dev/null; then
            options+=(--timeout=120)
          fi
          status=0
          python -m pytest -m hypothesis --hypothesis-profile=local --hypothesis-seed="$seed" "${options[@]}" || status=$?
          # 5: the project has no property tests yet.
          if [[ "$status" == 5 ]]; then
            echo "No property tests to run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
