name: Labels

# The job of templates/.github/workflows/labels.yml, which every repository that
# uses the issue assistant calls at the commit of a release. Creates and updates the
# repository's labels from .github/labels.toml and never deletes a label; one that
# is missing from the file is reported in the summary. The job blocks every host but
# GitHub's with Harden-Runner and runs the issue assistant of this workflow's own
# commit (decision 0015). https://github.com/Dennis-Otto/issue-assistant

on:
  workflow_call:
    inputs:
      dry_run:
        description: Only show what would change
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    name: Synchronize labels
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit of this workflow, which the caller pins. actionlint 1.7.12 doesn't
      # know job.workflow_repository and job.workflow_sha yet, which toJSON hides,
      # nor the self-repository syntax $/, which would need no checkout.
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          persist-credentials: false
      - name: Create and update the labels
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: sync-labels
          dry-run: ${{ inputs.dry_run }}
