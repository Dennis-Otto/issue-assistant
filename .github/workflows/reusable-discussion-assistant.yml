name: Discussion assistant

# The jobs of templates/.github/workflows/discussion-assistant.yml, which a repository
# that answers questions in its Discussions calls at the commit of a release.
# https://github.com/Dennis-Otto/issue-assistant
#
# event    no AI: whether the new discussion gets a first answer: its category is
#          one of [discussions] answer_categories, and the limits of the day
# analyze  the AI engine reads the checkout and a context folder and answers with
#          JSON, exactly as in reusable-issue-assistant.yml, which a test keeps
# analyze-in-reserve
#          the same steps on the runner of ISSUE_ASSISTANT_AI_RUNNER, behind
#          Harden-Runner, as in reusable-issue-assistant.yml
# apply    no AI: checks the engine's answer and is the only job that writes, one
#          comment on the discussion, and the only one that may write to discussions
#
# The jobs of the issues can't write to discussions: a called workflow that asks for
# more than its caller grants doesn't start, and a repository that only moves the
# pin of issue-assistant.yml grants them only reading. Decision 0018 says why.

on:
  workflow_call:
    inputs:
      dry_run:
        description: Only show what the assistant would do
        type: boolean
        default: false
    # The caller passes the engine's secrets by name. Only the job analyze sees their
    # values, those of the caller's environment issue-assistant.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: The OAuth token of Claude Code, for the engine claude
        required: false
      ANTHROPIC_API_KEY:
        description: The API key of Anthropic, for the engine claude
        required: false
      OPENAI_API_KEY:
        description: The API key of OpenAI, for the engine codex
        required: false
      GEMINI_API_KEY:
        description: The API key of the Gemini API, for the engine gemini
        required: false
      COPILOT_GITHUB_TOKEN:
        description: A fine-grained token with the permission Copilot Requests, for the engine copilot
        required: false

permissions: {}

jobs:
  event:
    name: Handle the event
    # Only for the events that it handles: a call for another one, such as a pull
    # request of the Workflow test of the issue assistant, skips every job.
    if: >-
      !github.event.repository.fork &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'discussion' &&
         github.event.sender.type != 'Bot'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      discussions: read
    outputs:
      issue: ${{ steps.event.outputs.issue }}
      mode: ${{ steps.event.outputs.mode }}
      # The endpoints of Harden-Runner for analyze-in-reserve, on the runner of
      # ISSUE_ASSISTANT_AI_RUNNER alone.
      endpoints: ${{ steps.endpoints.outputs.endpoints }}
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      # Discussion events always run the workflow and the settings of the default
      # branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit of this workflow, which the caller pins. actionlint 1.7.12 doesn't
      # know job.workflow_repository and job.workflow_sha yet, which toJSON hides,
      # nor the self-repository syntax $/, which would need no checkout.
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant/
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Choose the next task
        id: event
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: event
          dry-run: ${{ inputs.dry_run }}
      # The AI runs on GitHub's egress-firewall runner, a technical preview, or on
      # the runner that the variable ISSUE_ASSISTANT_AI_RUNNER names in its place,
      # such as ubuntu-24.04, should GitHub rename or end it. There Harden-Runner
      # blocks every host but those of .github/egress-firewall.yaml, which this step
      # names for it, and fails on a runner where nothing would block them; decision
      # 0019 says why.
      - name: Name the hosts of the firewall policy for the AI's runner
        id: endpoints
        if: vars.ISSUE_ASSISTANT_AI_RUNNER != '' && vars.ISSUE_ASSISTANT_AI_RUNNER != 'ubuntu-24.04-firewall'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        env:
          ISSUE_ASSISTANT_AI_RUNNER: ${{ vars.ISSUE_ASSISTANT_AI_RUNNER }}
        with:
          command: endpoints
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  # The AI on GitHub's egress-firewall runner. No step of Harden-Runner belongs in this
  # job, not even one that its condition skips: GitHub runs the pre step of an action,
  # which starts the agent of Harden-Runner, whatever the if of its step says
  # (decision 0027). The anchors, such as &engine, give its steps to analyze-in-reserve.
  analyze:
    name: Analyze with the AI engine
    needs: event
    if: >-
      needs.event.outputs.mode != '' &&
      needs.event.outputs.mode != 'none' &&
      vars.ISSUE_ASSISTANT_AI != 'off' &&
      (vars.ISSUE_ASSISTANT_AI_RUNNER == '' ||
        vars.ISSUE_ASSISTANT_AI_RUNNER == 'ubuntu-24.04-firewall')
    # GitHub's egress-firewall runner, whose firewall blocks every host but those of
    # the caller's .github/egress-firewall.yaml for the whole machine.
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 20
    # The engine's secret belongs to this environment of the caller, limited to the
    # default branch; no deployment is recorded for a run.
    environment: &ai-environment
      name: issue-assistant
      deployment: false
    permissions: &ai-permissions
      contents: read
      issues: read
      discussions: read
    outputs: &ai-outputs
      engine: ${{ steps.engine.outputs.engine }}
      # One answer per engine step; only the chosen engine runs.
      answer: ${{ steps.claude.outputs.structured_output || steps.codex.outputs.final-message || steps.gemini.outputs.answer || steps.copilot.outputs.answer }}
    steps:
      # The AI runs only behind a block that holds, on both runners: GitHub's egress
      # firewall enforces the policy only for a job that may read the repository, and
      # its preview may change how it finds and reads the policy, without a warning;
      # Harden-Runner fails open, in a private repository without a subscription of
      # StepSecurity or when its service is down. So before any step that gets the
      # engine's secret, a host outside the policy has to be out of reach, and the job
      # stops otherwise. Decision 0025.
      - &network-block
        name: Make sure that the network block holds
        run: |
          # A request to example.com, a host of no firewall policy, has to fail: two in a
          # row, five seconds apart, so that a hiccup of example.com isn't taken for the
          # block, within a minute, since Harden-Runner lets the job go on while its agent
          # still starts. Then a request to api.github.com, a host of every policy, has to
          # get an answer, so that a network that reaches no host isn't taken for it.
          failures=0
          attempt=0
          while [ "$failures" -lt 2 ]; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 12 ]; then
              echo "::error::A request to example.com, a host outside .github/egress-firewall.yaml, got through, so the AI doesn't run: nothing blocks the hosts that the policy leaves out. On ubuntu-24.04-firewall, GitHub didn't enforce the policy: the job lacks the permission contents: read, the policy says mode: log in place of mode: enforce, or GitHub changed its preview of the egress firewall. Behind Harden-Runner, on the runner of ISSUE_ASSISTANT_AI_RUNNER, it blocks in a private repository only with a subscription of StepSecurity, and when its log says Reverted changes, its agent gave up at its start: run the job again. Until the block holds, set ISSUE_ASSISTANT_AI to off: https://dennis-otto.github.io/issue-assistant/troubleshooting/"
              exit 1
            fi
            if curl --silent --max-time 10 --output /dev/null https://example.com; then
              failures=0
            else
              failures=$((failures + 1))
            fi
            [ "$failures" -ge 2 ] || sleep 5
          done
          attempt=1
          until curl --silent --max-time 10 --output /dev/null https://api.github.com/; do
            if [ "$attempt" -ge 12 ]; then
              echo "::error::No request to api.github.com, a host of every firewall policy, got an answer within a minute, so the failed requests to example.com prove no block, and the AI doesn't run: the runner reaches no host. Run the job again."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "The network blocks example.com, a host outside .github/egress-firewall.yaml, and lets api.github.com through."
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - &workflow-commit
        name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the context folder, which .gitignore leaves out of the checkout's files.
      - &assistant-checkout
        name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant/
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The engine and what a run of the task may use: its model, turns, dollars and
      # effort, from config.toml.
      - &engine
        name: Choose the engine and check its secret
        id: engine
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: engine
          mode: ${{ needs.event.outputs.mode }}
          # One entry per engine: its key when its secret exists.
          ready-engines: >-
            ${{ format('{0},{1},{2},{3}',
            (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') && 'claude' || '',
            (secrets.OPENAI_API_KEY != '') && 'codex' || '',
            (secrets.GEMINI_API_KEY != '') && 'gemini' || '',
            (secrets.COPILOT_GITHUB_TOKEN != '') && 'copilot' || '') }}
      - &context
        name: Collect the issue, earlier issues and discussions
        id: context
        if: steps.engine.outputs.ready == 'true'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: context
          issue: ${{ needs.event.outputs.issue }}
          mode: ${{ needs.event.outputs.mode }}

      # The engines. Each one gets the rules before its task and the JSON schema,
      # may only read files of the checkout and returns the JSON answer.

      - &claude
        name: Analyze with Claude
        id: claude
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Issues come from people without write access. The token is the job's
          # read-only GITHUB_TOKEN, and Claude can only read files of the checkout.
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          prompt: ${{ steps.context.outputs.task }}
          # --restricted removes every tool that runs code or reaches the network,
          # ignores settings files and confines the file tools to the checkout;
          # --tools leaves only the reading tools, which never see the issue
          # assistant's own checkout, and nothing ever prompts. The rules come
          # first, as the system prompt, and the task stops at its turns and
          # dollars.
          claude_args: |
            --restricted
            --tools "Read,Grep,Glob"
            --disallowedTools "Read(./.issue-assistant/action/**)"
            --permission-prompts none
            --append-system-prompt-file .issue-assistant/rules.md
            --model ${{ steps.engine.outputs.model }}
            --max-turns ${{ steps.engine.outputs.turns }}
            --max-budget-usd ${{ steps.engine.outputs.budget }}
            ${{ steps.engine.outputs.effort && format('--effort {0}', steps.engine.outputs.effort) || '' }}
            --json-schema '${{ steps.context.outputs.schema }}'
      - &codex
        name: Analyze with Codex
        id: codex
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'codex'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        # The action prints what Codex prints into the log, where the runner reads
        # each line that starts with :: as a workflow command. With --json from the
        # context step, Codex prints only JSON events, one per line, and RUST_LOG
        # turns off its log, so no text of an issue or of Codex starts a line.
        env:
          RUST_LOG: "off"
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # renovate: datasource=npm depName=@openai/codex
          codex-version: "0.164.0"
          # Issues come from people without write access. The sandbox of the
          # profile :read-only lets Codex read files but neither write them nor
          # reach the network, and drop-sudo leaves the API key to the proxy of the
          # action, out of Codex's reach. The context step's arguments give it the
          # rules as its developer instructions and turn off its web search, and
          # its strict schema shapes the answer.
          allow-users: "*"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .issue-assistant/prompt.md
          output-schema-file: .issue-assistant/schema.json
          codex-args: ${{ steps.context.outputs.engine-args }}
          model: ${{ steps.engine.outputs.model }}
          effort: ${{ steps.engine.outputs.effort }}
      # The Gemini CLI and the Copilot CLI have no action that keeps them to reading,
      # so the issue assistant runs them, with only their tools that read files of
      # the checkout and no token of GitHub (decision 0017).
      - &gemini
        name: Analyze with Gemini
        id: gemini
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'gemini'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          command: analyze
          mode: ${{ needs.event.outputs.mode }}
          engine: gemini
      - &copilot
        name: Analyze with Copilot
        id: copilot
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'copilot'
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          command: analyze
          mode: ${{ needs.event.outputs.mode }}
          engine: copilot
      # Numbers alone, also after a failure: the turns, time, cost and tokens of
      # the run, in the summary of the job.
      - &usage
        name: Report what the analysis cost
        id: usage
        if: always() && steps.claude.outputs.execution_file != ''
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: usage
          issue: ${{ needs.event.outputs.issue }}
          mode: ${{ needs.event.outputs.mode }}
          execution-file: ${{ steps.claude.outputs.execution_file }}

  # The AI on the runner that the caller's variable ISSUE_ASSISTANT_AI_RUNNER
  # names, should GitHub rename or end its egress-firewall runner, a technical
  # preview; the job event checks the runner and names the hosts of the firewall
  # policy. A job of its own: GitHub runs the pre step of an action, which starts
  # the agent of Harden-Runner, even when the if of its step is false, so in
  # analyze the agent would run on the firewall runner too. The aliases, such as
  # *engine, take the steps of analyze, so that the AI runs the same steps on either
  # runner.
  analyze-in-reserve:
    name: Analyze with the AI engine on the runner in reserve
    needs: event
    if: >-
      needs.event.outputs.mode != '' &&
      needs.event.outputs.mode != 'none' &&
      vars.ISSUE_ASSISTANT_AI != 'off' &&
      vars.ISSUE_ASSISTANT_AI_RUNNER != '' &&
      vars.ISSUE_ASSISTANT_AI_RUNNER != 'ubuntu-24.04-firewall'
    runs-on: ${{ vars.ISSUE_ASSISTANT_AI_RUNNER }}
    timeout-minutes: 20
    environment: *ai-environment
    permissions: *ai-permissions
    outputs: *ai-outputs
    steps:
      # Harden-Runner blocks every host but those of the firewall policy for this
      # job, as the firewall does for the whole machine of its runner. The engines
      # need sudo, to install what isolates them, and run no command that could lift
      # the block.
      - name: Block every host but those of the firewall policy
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: ${{ needs.event.outputs.endpoints }}
      # GitHub's DNS experiment on some of its runners hides the lookups of the job from
      # Harden-Runner, which then blocks the hosts of the policy until the time limit
      # (step-security/harden-runner#708). Harden-Runner takes it away unless its
      # feature flags say no; a job that keeps sudo makes sure, as decision 0123 of the
      # blueprint has its jobs do. Just here, where Harden-Runner runs, never in
      # analyze, on the firewall runner, whose firewall this step must not touch. Once
      # the next step made sure that Harden-Runner has an agent that blocks, the one
      # after it checks the block as the engine meets it.
      - name: Let Harden-Runner see the DNS lookups
        run: |
          dropins=(/etc/systemd/resolved.conf.d/90-egress-proxy.conf /run/systemd/resolved.conf.d/90-egress-proxy.conf)
          if [[ ! -e ${dropins[0]} && ! -e ${dropins[1]} ]] && ! grep -qs 127.0.0.100 /etc/resolv.conf; then
            exit 0
          fi
          echo "::notice::GitHub's DNS experiment is on this runner; taking it out of the way of Harden-Runner."
          sudo rm -f "${dropins[@]}"
          sudo systemctl restart systemd-resolved
          sudo ln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          sudo systemctl stop egress-dns-resolver.service egress-outbound-proxy.service || true
          sudo resolvectl flush-caches || true
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - *network-block
      - name: Wait until Harden-Runner lets the hosts through
        # Only the hosts that the next steps need first, and that the runner may have
        # asked for past Harden-Runner, which then blocks such an address for as long as
        # systemd-resolved keeps it, up to a minute. The policy also names hosts of the
        # engines that this repository may not use, and a mirror that answers only on
        # port 80; waiting for those would hold up the AI for two minutes.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - *workflow-commit
      - *checkout
      - *assistant-checkout
      - *engine
      - *context
      - *claude
      - *codex
      - *gemini
      - *copilot
      - *usage

  apply:
    name: Check and post the answer
    needs: [event, analyze, analyze-in-reserve]
    # After an answer of the engine on either runner; written out, what GitHub
    # otherwise adds: the jobs that ran passed. One of analyze and analyze-in-reserve
    # is always skipped, which would skip apply without a status function.
    if: >-
      !cancelled() && needs.event.result == 'success' &&
      ((needs.analyze.result == 'success' && needs.analyze.outputs.answer != '') ||
        (needs.analyze-in-reserve.result == 'success' &&
          needs.analyze-in-reserve.outputs.answer != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      discussions: write
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0029).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # The checkouts below take the issue assistant of the commit of this workflow,
      # which GitHub names in the context of the job. Without one, actions/checkout
      # would take the caller's own repository at its default branch, and the job
      # would run the caller's action.yml in place of the release that it pins.
      - name: Make sure that GitHub names the commit of this workflow
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub gave this job no repository and commit of its reusable workflow: job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha '$WORKFLOW_SHA', no full commit SHA. The checkout would take $GITHUB_REPOSITORY at its default branch in place of the issue assistant that the caller pins, so the job stops before it. Run it again; should it fail again, GitHub has changed the context of a job: please tell https://github.com/Dennis-Otto/issue-assistant/issues"
            exit 1
          fi
          echo "The issue assistant of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the issue assistant of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .issue-assistant/action
          # Only what the action runs: the engine reads the context folder, and the
          # docs and tests of the issue assistant would only mislead it there.
          sparse-checkout: |
            /action.yml
            /issue_assistant/
            /version.txt
            /prompts/
            /locales/
            /templates/
            /engines/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the engine's answer and post it
        uses: ./.issue-assistant/action # zizmor: ignore[self-repository]
        with:
          command: apply
          issue: ${{ needs.event.outputs.issue }}
          mode: ${{ needs.event.outputs.mode }}
          engine: ${{ needs.analyze.outputs.engine || needs.analyze-in-reserve.outputs.engine }}
          answer: ${{ needs.analyze.outputs.answer || needs.analyze-in-reserve.outputs.answer }}
          dry-run: ${{ inputs.dry_run }}
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
