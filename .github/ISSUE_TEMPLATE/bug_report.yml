name: Bug report
description: The issue assistant does something wrong or fails in a repository.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Within a few minutes, an AI issue assistant posts a first analysis and may ask questions; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/issue-assistant/blob/main/SUPPORT.md#what-happens-with-your-issue)).

        **Never post** tokens, keys or other personal data. Report a vulnerability privately, as described in [SECURITY.md](https://github.com/Dennis-Otto/issue-assistant/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First analysis or follow-up
        - Reminders, closing or duplicates
        - Install, check, templates or labels
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release of the issue assistant
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Link to the workflow run
      description: The run of the repository where it happened, if it is public.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The relevant lines of the run's log or summary.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed tokens, keys and personal data from everything I posted.
          required: true
