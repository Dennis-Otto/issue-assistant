# Every label of the repository. The Labels workflow of the issue assistant
# (https://github.com/Dennis-Otto/issue-assistant) creates missing labels and updates
# color and description from this file when it changes on main; it never deletes a
# label. Rename a label on GitHub first, then here.
#
# group decides who sets a label:
#   type       the kind of an issue; the issue forms set one, the assistant may correct it
#   area       the part of the project; set from the Area field and by the assistant
#   topic      cross-cutting topics the assistant may add
#   lifecycle  set and removed by the issue assistant's rules
#   decision   set by the maintainer only
#   release    set by the pull request title check and the release bot
#
# ask = false keeps the assistant from asking reporters of that kind for information.

# Types

[[label]]
name = "bug"
color = "d73a4a"
description = "Something isn't working"
group = "type"

[[label]]
name = "enhancement"
color = "a2eeef"
description = "New feature or improvement"
group = "type"
ask = false

[[label]]
name = "question"
color = "d876e3"
description = "A question about setup or use"
group = "type"

[[label]]
name = "documentation"
color = "0075ca"
description = "Improvements or additions to documentation"
group = "type"
form_options = ["Documentation"]

[[label]]
name = "maintenance"
color = "6f42c1"
description = "CI, repository maintenance and release tooling"
group = "type"

# Areas: one per part of the project, with the options of the Area field.

[[label]]
name = "area: analysis"
color = "bfdadc"
description = "The first analysis, follow-ups, prompts, engines and the checks of answers"
group = "area"
form_options = ["First analysis or follow-up"]

[[label]]
name = "area: lifecycle"
color = "bfdadc"
description = "Reminders, closing, reopening and duplicates"
group = "area"
form_options = ["Reminders, closing or duplicates"]

[[label]]
name = "area: setup"
color = "bfdadc"
description = "Install, check, the templates and the labels"
group = "area"
form_options = ["Install, check, templates or labels"]

# Topics

[[label]]
name = "accessibility"
color = "f143ab"
description = "Barrier affecting people with disabilities"
group = "topic"

[[label]]
name = "translations"
color = "c5def5"
description = "User interface or documentation translations"
group = "topic"

# Lifecycle

[[label]]
name = "needs-triage"
color = "fbca04"
description = "Not yet reviewed by a maintainer"
group = "lifecycle"

[[label]]
name = "needs-info"
color = "fef2c0"
description = "Waiting for the reporter: reminder after 15 days, closed after 30 days"
group = "lifecycle"

[[label]]
name = "stale"
color = "f9d0c4"
description = "Reminder sent; closes 15 days later without an answer"
group = "lifecycle"

[[label]]
name = "possible-duplicate"
color = "e4e4e4"
description = "Closes as a duplicate 3 days after the notice unless someone objects"
group = "lifecycle"

[[label]]
name = "duplicate"
color = "cfd3d7"
description = "This issue or pull request already exists"
group = "lifecycle"

[[label]]
name = "invalid"
color = "e4e669"
description = "Spam, or not about this project"
group = "lifecycle"

[[label]]
name = "fixed-in-next-release"
color = "c2e0c6"
description = "Fixed on main; closes with a link when a release ships the fix"
group = "lifecycle"

# Decisions

[[label]]
name = "confirmed"
color = "0e8a16"
description = "Reproduced and accepted"
group = "decision"

[[label]]
name = "upstream"
color = "d4c5f9"
description = "Caused by a project this one builds on"
group = "decision"

[[label]]
name = "wontfix"
color = "ffffff"
description = "This will not be worked on"
group = "decision"

[[label]]
name = "help wanted"
color = "008672"
description = "Extra attention is needed"
group = "decision"

[[label]]
name = "good first issue"
color = "7057ff"
description = "Good for newcomers"
group = "decision"

# Release: set from the title of a pull request, and by the release bot

[[label]]
name = "breaking-change"
color = "b60205"
description = "Repositories must change their set-up"
group = "release"

[[label]]
name = "security"
color = "ee0701"
description = "Fixes a vulnerability or hardens security"
group = "release"

[[label]]
name = "dependencies"
color = "0366d6"
description = "Dependency updates"
group = "release"

[[label]]
name = "release"
color = "5319e7"
description = "The pull request of the release bot"
group = "release"

[[label]]
name = "autorelease: pending"
color = "ededed"
description = "Release bot: the pull request of the next release, until it is released"
group = "release"

[[label]]
name = "autorelease: tagged"
color = "ededed"
description = "Release bot: the release is created"
group = "release"

[[label]]
name = "merge-conflict"
color = "b60205"
description = "Conflicts with main; the branch bot can't bring it up to date"
