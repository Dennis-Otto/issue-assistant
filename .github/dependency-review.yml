# Rules of the dependency review of pull requests (.github/workflows/dependency-review.yml).
# An advisory that this repository accepts, for example in a dependency that only
# the tests install and that a pinned upstream can't move yet, goes into
# allow-ghsas with its reason.
fail-on-severity: moderate
fail-on-scopes:
  - runtime
  - development
  - unknown
show-patched-versions: true
retry-on-snapshot-warnings: true
allow-ghsas: []

# The licenses a new dependency may have: free licenses that the MIT
# license of this project can carry.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC-BY-3.0
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MIT
  - MIT-CMU
  - MIT-0
  - MPL-2.0
  - OFL-1.1
  - PSF-2.0
  - Python-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - Unlicense
  - Zlib

# Dependencies that no release ships, whatever their license.
allow-dependencies-licenses:
  # The tools of the blueprint bot (.github/copier-requirements.txt), which no release
  # ships: Copier's Jinja filters (GPL-3.0-only) and typing-extensions, whose
  # license the review reads wrongly.
  - pkg:pypi/jinja2-ansible-filters
  - pkg:pypi/typing-extensions
  # The dictionaries of cspell, the spell check of the prose in .github/prose/, which
  # only the checks run: Django's words (WTFPL) and the common misspellings
  # (CC-BY-SA-4.0).
  - pkg:npm/%40cspell/dict-django
  - pkg:npm/%40cspell/dict-en-common-misspellings
  # The Copilot CLI and its build for each system, under GitHub's own terms ("SEE
  # LICENSE IN LICENSE.md"), which no release ships either: engines/copilot/ pins
  # their versions and hashes, and `analyze` installs them from npm only in a
  # repository that chose Copilot as its engine, under its owner's subscription.
  # tests/test_engines.py keeps this list equal to the lock file.
  - pkg:npm/%40github/copilot
  - pkg:npm/%40github/copilot-darwin-arm64
  - pkg:npm/%40github/copilot-darwin-x64
  - pkg:npm/%40github/copilot-linux-arm64
  - pkg:npm/%40github/copilot-linux-x64
  - pkg:npm/%40github/copilot-linuxmusl-arm64
  - pkg:npm/%40github/copilot-linuxmusl-x64
  - pkg:npm/%40github/copilot-win32-arm64
  - pkg:npm/%40github/copilot-win32-x64
  # The command line of Claude and its build for each system, under Anthropic's own
  # terms ("SEE LICENSE IN README.md"), which no release ships either: build-release
  # leaves .github out, and only the Evaluate workflow installs them, from
  # .github/evaluate/, when a maintainer runs it. tests/test_evaluate.py keeps this
  # list equal to that lock file.
  - pkg:npm/%40anthropic-ai/claude-code
  - pkg:npm/%40anthropic-ai/claude-code-darwin-arm64
  - pkg:npm/%40anthropic-ai/claude-code-darwin-x64
  - pkg:npm/%40anthropic-ai/claude-code-linux-arm64
  - pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl
  - pkg:npm/%40anthropic-ai/claude-code-linux-x64
  - pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl
  - pkg:npm/%40anthropic-ai/claude-code-win32-arm64
  - pkg:npm/%40anthropic-ai/claude-code-win32-x64
