# The answers of OpenSSF Best Practices (https://www.bestpractices.dev) that only this
# repository can give, on top of .bestpractices.json, which the blueprint keeps current
# with what it guarantees for every repository of its kind. Never change that file: an
# answer of this repository alone goes here, and no update of the blueprint touches it.
#
# One table for each criterion, named as in .bestpractices.json, such as [test] or
# [osps_br_07_01]. For a criterion that .bestpractices.json answers, a table gives only
# its justification, which replaces the file's own: the status stays the blueprint's
# Met. For any other criterion, such as security_review, a table gives status (Met,
# Unmet or N/A) and justification. A link names a file or a heading of this repository,
# or uses https. Only what is true of this repository belongs here, such as its own
# end-to-end tests:
#
# [test]
# justification = "pytest, and the end-to-end tests in Docker: https://github.com/OWNER/REPOSITORY/blob/main/tests/e2e/run.sh"
#
# [security_review]
# status = "Met"
# justification = "..."
#
# The weekly run of the workflow Links compares the public entry with both files and
# keeps an issue with the links of the edit pages that take the answers in: change an
# answer here, not on the site, as these links force it back. "Save (and continue)" on
# bestpractices.dev reads .bestpractices.json only. The step "Answers for
# bestpractices.dev" of scripts/check.sh checks this file with
# python3 .github/blueprint.py best-practices --verify.
# https://github.com/Dennis-Otto/repo-blueprint/blob/main/docs/features/bots.md#the-entry-on-bestpracticesdev

[test]
justification = "An automated test suite, which scripts/check.sh runs with pytest and its coverage, on a computer and in the CI, and which fails when a line or a branch of the package issue_assistant/ or of the Python scripts in scripts/ runs in no test; GitHub and gh are fakes, golden files hold what the assistant writes word for word, and every GraphQL document and REST request meets the copy of GitHub's schema and description; property tests with Hypothesis generate the engine's text and whole answers, check every comment made of them against the Markdown parser of tests/oracle.py and play the lifecycle of an issue in any order of events, with fixed inputs in the CI and new ones every night; Atheris fuzzes the cleaning, the comments and the reading of issues, and every Monday the mutation tests show each change of the code that no test noticed: https://github.com/Dennis-Otto/issue-assistant/blob/main/tests/README.md"

[test_continuous_integration]
justification = "The CI runs scripts/check.sh with the tests on every pull request and after every change of main, as a required check, and more required checks run the action itself: action, of the Action test, installs it into the sample repository and into a copy of this one and runs it as its users do on the runner of the templates, and the same job runs it on two other images as well, on every pull request, after every change of main and every week; engine contracts checks the action and the command line of each engine without a key; reusable workflows, of the Workflow test, runs each reusable workflow as a repository calls it, as a dry run whose smoke test checks a fixed answer in place of the engine's; fuzz fuzzes every target in fuzz/ in each pull request that changes what they read, and the property tests run with new inputs every night: https://github.com/Dennis-Otto/issue-assistant/blob/main/.github/workflows/action-test.yml"

[coding_standards]
justification = "CONTRIBUTING.md names the coding standards that contributions follow: PEP 8 in the format of Ruff and type hints that mypy checks in its strict mode for Python; ShellCheck for the shell scripts, actionlint and zizmor for the workflows, markdownlint for Markdown and .editorconfig for every text file; and the rules of the action itself: the package issue_assistant/ runs on the Python 3.12 of GitHub's runners with the standard library alone, a module imports only from those before it in issue_assistant/__init__.py, and the prompts and comment texts name no AI vendor, which only the engine table ENGINES does: https://github.com/Dennis-Otto/issue-assistant/blob/main/CONTRIBUTING.md#coding-standards https://github.com/Dennis-Otto/issue-assistant/blob/main/CONTRIBUTING.md#requirements-for-changes"

[coding_standards_enforced]
justification = "scripts/check.sh runs ruff format --check, ruff check, mypy in its strict mode and ShellCheck, and the Lint workflow actionlint, markdownlint, REUSE and the DCO check, on every pull request, which merges only when they pass; a new alert of zizmor's audit of the workflows stops the merge as well, and CONTRIBUTING.md asks that an exception to a rule be rare and marked at its place in the code, with its reason in a comment. The tests enforce the rules of the action: tests/test_package.py fails on an import from outside the standard library but PyYAML, on a module that imports one after it, and on a module above 1,500 lines or a function above 150; tests/test_templates.py fails on the name of an AI vendor in the code of issue_assistant/ outside ENGINES or in a prompt of prompts/, and pins the security rules of the workflow templates: https://github.com/Dennis-Otto/issue-assistant/blob/main/scripts/check.sh"

[external_dependencies]
justification = "At run time the package issue_assistant/ needs only the standard library of the runner's Python, gh and git, and PyYAML where the runner's image has it, with yq otherwise, as decision 0003 says and tests/test_package.py checks; the engines that the job analyze runs are pinned in the reusable workflows, the actions of Claude Code and Codex by their commit hashes and the command line of Codex below a line # renovate:, and the Gemini CLI and the Copilot CLI in the package.json and package-lock.json of engines/; requirements-dev.in lists the tools of the tests and checks, requirements-fuzz.in those of the fuzzing and requirements-images.in those of the pictures of the documentation, and the requirements .txt file of each pins them with their hashes: https://github.com/Dennis-Otto/issue-assistant/blob/main/docs/decisions/0003-the-standard-library-alone.md"

[updateable_reused_components]
justification = "Every dependency comes from its package manager, pinned in a lock file, every action by its commit hash and every image by its digest, and Renovate updates them; the action itself runs on the standard library of Python, gh and git, which GitHub's runners bring and keep current, and the repository vendors no third-party code: the copies of GitHub's GraphQL schema and REST description in tests/github/, which the tests read, meet the current ones in the Action test every week, which brings copies that are behind in a pull request: https://github.com/Dennis-Otto/issue-assistant/blob/main/GOVERNANCE.md#automation"
