  Para continuar, adicione o seguinte, em um comentário ou editando a issue:"""
"missing.outro" = """\
  Sem resposta, um lembrete chega após {remind_days} e a issue é fechada após \
  {close_days}. Se ela for fechada, uma resposta a reabre."""
duplicate = "Possível duplicata"
"duplicate.text" = "Isto parece uma duplicata de #{number}: {reason}"
"duplicate.close" = """\
  Se estiver certo, você não precisa fazer nada: a issue será fechada como duplicata \
