"thanks.feedback" = "Obrigado por testar e pelo feedback, @{author}!"
"thanks.maintenance" = "Obrigado pelo relato, @{author}!"
intro = """\
  Sou o assistente de issues deste repositório e dei uma primeira olhada. Os \
  mantenedores também leem cada issue."""
summary = "Resumo"
analysis = "Primeira análise"
next_steps = "Vale a pena tentar"
missing = "Informações necessárias"
