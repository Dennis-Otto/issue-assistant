#
# The comments of the issue assistant in Italian.
# A machine draft: native speakers are welcome to improve it.
# Every catalog in locales/ has the texts of locales/en.toml with the same
# placeholders in braces, twelve months and stopwords of its own, which
# tests/test_assistant.py checks. A new language is one more file, named after its
# code of ISO 639-1, such as fr.toml.

# The language in English, as the prompt names it to the AI.
name = "Italian"
# How the comments address a reporter, which the AI does too; empty when the
# language has one way only.
address = "tu"
# How a comment names a day: {day}, {month} from the months below, and {year}.
date = "{day} {month} {year}"
months = [
  "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto",
  "settembre", "ottobre", "novembre", "dicembre",
]
# Words that are frequent in the language and in no other catalog. A reporter
# writes in the language of whose stopwords their words have the most, in
# English when no other language has more, or fewer than two.
stopwords = [
  "il", "non", "che", "di", "una", "gli", "nel", "della", "questo", "anche", "ma",
  "funziona", "sono", "ho", "mi", "lo", "del", "al", "dopo", "perché", "molto",
  "ancora", "ogni", "grazie", "versione", "è",
]

sample = "La scheda non mostra niente quando lancio una freccetta: non è normale."

# The texts of the comments, by the keys that the package issue_assistant uses.
[text]
"thanks.default" = "Grazie per aver aperto questa segnalazione, @{author}!"
"thanks.bug" = "Grazie per la segnalazione, @{author}!"
"thanks.enhancement" = "Grazie per il suggerimento, @{author}!"
"thanks.question" = "Grazie per la domanda, @{author}!"
"thanks.documentation" = "Grazie per la nota sulla documentazione, @{author}!"
"thanks.compatibility" = "Grazie per il resoconto sulla compatibilità, @{author}!"
"thanks.feedback" = "Grazie per aver provato e per il feedback, @{author}!"
"thanks.maintenance" = "Grazie per la segnalazione, @{author}!"
intro = """\
  Sono l'assistente delle segnalazioni di questo repository e ho dato una prima \
  occhiata. Anche i manutentori leggono ogni segnalazione."""
summary = "Riepilogo"
analysis = "Prima analisi"
next_steps = "Da provare"
missing = "Informazioni necessarie"
"missing.intro" = """\
  Per proseguire, aggiungi quanto segue, in un commento o modificando la segnalazione:"""
"missing.outro" = """\
  Senza risposta, dopo {remind_days} arriva un promemoria e dopo {close_days} la \
  segnalazione viene chiusa. Se viene chiusa, una risposta la riapre."""
duplicate = "Possibile duplicato"
"duplicate.text" = "Sembra un duplicato di #{number}: {reason}"
"duplicate.close" = """\
  Se è così, non devi fare nulla: la segnalazione verrà chiusa come duplicato di \
  #{number} tra {grace_days}, così la conversazione resta in un unico posto. Un 👍 su \
  #{number} mostra che sono coinvolte più persone. Se si tratta di altro, scrivi un \
  commento o reagisci a questo commento con 👎, e resterà aperta."""
"duplicate.named" = """\
  @{author}, un manutentore ha segnato questa segnalazione come duplicato di \
  #{number}."""
related = "Correlati"
discussion = "discussione"
"belongs_in" = """\
  Questo potrebbe riguardare {repository} più che questo repository; in tal caso, un \
  manutentore può trasferirvi la segnalazione."""
references = "Dove guardare"
links = "Dove guardare: {count} link"
maintainers = "Per i manutentori, in italiano"
"sensitive.secret" = """\
  > [!WARNING]\n> Questa segnalazione sembra mostrare un segreto, come un token, una \
  chiave o una password. Rimuovilo modificando il messaggio, elimina la versione \
  precedente dalla cronologia delle modifiche e sostituisci il segreto, perché altri \
  potrebbero averlo visto."""
"sensitive.personal" = """\
  > [!NOTE]\n> Questa segnalazione sembra mostrare dati personali, come un indirizzo \
  e-mail, un indirizzo IP pubblico o l'indirizzo di un server privato. Se preferisci \
  non mostrarli, modifica il messaggio ed elimina la versione precedente dalla \
  cronologia delle modifiche."""
security = """\
  > [!CAUTION]\n> Questo potrebbe descrivere una vulnerabilità di sicurezza. Segnalala \
