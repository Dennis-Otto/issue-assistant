"thanks.question" = "Dzięki za pytanie, @{author}!"
"thanks.documentation" = "Dzięki za uwagę dotyczącą dokumentacji, @{author}!"
"thanks.compatibility" = "Dzięki za zgłoszenie dotyczące zgodności, @{author}!"
"thanks.feedback" = "Dzięki za testy i opinię, @{author}!"
"thanks.maintenance" = "Dzięki za zgłoszenie, @{author}!"
intro = """\
  Jestem asystentem zgłoszeń tego repozytorium i to moja pierwsza analiza. \
  Opiekunowie projektu też czytają każde zgłoszenie."""
summary = "Podsumowanie"
analysis = "Pierwsza analiza"
next_steps = "Warto spróbować"
missing = "Potrzebne informacje"
"missing.intro" = """\
  Aby kontynuować, dodaj proszę poniższe informacje w komentarzu lub edytując \
  zgłoszenie:"""
"missing.outro" = """\
  Bez odpowiedzi za {remind_days} pojawi się przypomnienie, a za {close_days} \
  zgłoszenie zostanie zamknięte. Jeśli zostanie zamknięte, odpowiedź otworzy je \
  ponownie."""
duplicate = "Możliwy duplikat"
"duplicate.text" = "To wygląda na duplikat #{number}: {reason}"
"duplicate.close" = """\
  Jeśli tak jest, nie musisz nic robić: za {grace_days} zgłoszenie zostanie zamknięte \
  jako duplikat #{number}, żeby rozmowa toczyła się w jednym miejscu. 👍 przy \
  #{number} pokazuje, że problem dotyczy większej liczby osób. Jeśli chodzi o coś \
  innego, napisz komentarz albo zareaguj na ten komentarz 👎, a zgłoszenie pozostanie \
  otwarte."""
"duplicate.named" = """\
  @{author}, to zgłoszenie zostało oznaczone przez opiekuna jako duplikat #{number}."""
related = "Powiązane"
discussion = "dyskusja"
belongs_in = """\
  To może bardziej pasować do {repository} niż tutaj; jeśli tak, opiekun może \
  przenieść tam zgłoszenie."""
references = "Gdzie szukać"
links = "Gdzie szukać (linki: {count})"
maintainers = "Dla opiekunów, po polsku"
"sensitive.secret" = """\
  > [!WARNING]\n> To zgłoszenie wydaje się zawierać sekret, na przykład token, klucz \
  lub hasło. Usuń go, edytując wpis, usuń wcześniejszą wersję z historii edycji i \
